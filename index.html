  stepOver(dt);
  if (gameState === "play"){
    playT += dt;
    if (playT >= nextFever && !fever){ startFever(); nextFever += FEVER_EVERY; }
    stepFever(dt);
    if (limit){
      const left = limit - playT;
      const sec = Math.ceil(left);
      if (sec <= 10 && sec >= 1 && sec !== lastTick){ lastTick = sec; beep(sec <= 3 ? 1046 : 784, .06, "sine", .05); }
      if (left <= 0) endGame();
    }
  } else if (gameState === "end"){
    endT += dt;
    if (endT > 1.4 && !document.getElementById("result").classList.contains("show")) showResult();
  }
  paintHUD();
}
function fmt(t){ t = Math.max(0, Math.ceil(t)); return Math.floor(t/60) + ":" + String(t % 60).padStart(2, "0"); }
function paintHUD(){
  setText(document.getElementById("scoreV"), scoreNow());
  const tv = document.getElementById("timeV");
  if (limit){ setText(tv, fmt(limit - playT)); tv.classList.toggle("hurry", gameState === "play" && limit - playT <= 10); }
  else setText(tv, fmt(playT));
  setText(document.getElementById("timeL"), limit ? "残り" : "経過");
  const fb = document.getElementById("feverBar");
  const k = fever ? 1 : clamp(1 - (nextFever - playT)/FEVER_EVERY, 0, 1);
  fb.style.width = (k*100).toFixed(1) + "%";
  fb.classList.toggle("now", !!fever);
  paintTimeBar();
}
/* ============================================================
   のこり時間の バー（第6版・作者が C案を えらんだ）
   ------------------------------------------------------------
   お盆の 下に 大きな バー。バーの さきを **いちばん 小さい子（TIERS[LAST]）** が
   ぴょこぴょこ 走る。いまは ひよこ だが、キャラえらびを 入れたら その回の いちばん
   小さい子に なる（名前を じかに 書かない こと）。
   のこり 30秒で オレンジ、10秒で 赤。無制限の ときは バーを 出さず「けいか」だけ。
   ============================================================ */
const tbFill = document.getElementById("tbFill"), tbRun = document.getElementById("tbRun");
const tbNum = document.getElementById("tbNum"), tbLbl = document.getElementById("tbLbl"), tbBox = document.getElementById("timebar");
const tbCtx = tbRun.getContext("2d");
let tbColKey = "";
function paintTimeBar(){
  if (gameState === "home"){ return; }
  const left = limit ? Math.max(0, limit - playT) : playT;
  setText(tbNum, fmt(left));
  setText(tbLbl, limit ? "残り" : "経過");
  tbBox.classList.toggle("free", !limit);
  const hurry = limit && left <= 10 && gameState === "play";
  tbNum.classList.toggle("hurry", !!hurry);
  if (!limit) return;
  const k = clamp(left/limit, 0, 1);
  tbFill.style.width = (k*100).toFixed(2) + "%";
  const key = left <= 10 ? "r" : left <= 30 ? "o" : "t" + TH.nm;
  if (key !== tbColKey){
    tbColKey = key;
    tbFill.style.background = key === "r" ? "linear-gradient(90deg,#ff6f8c,#ffa0b3)"
                            : key === "o" ? "linear-gradient(90deg,#ffa94d,#ffd27a)"
                            : `linear-gradient(90deg,${C.archL},${C.arch})`;
  }
  tbFill.classList.toggle("pulse", !!hurry);
  // 走る 子（バーの さき）
  tbRun.style.left = `calc(${(k*100).toFixed(2)}% * (1 - 40px / 100%))`;
  tbRun.style.left = `calc(20px + (100% - 40px) * ${k.toFixed(4)})`;
  const w = tbRun.clientWidth, h = tbRun.clientHeight;
  if (!w) return;
  if (tbRun.width !== Math.round(w*DPR)){ tbRun.width = Math.round(w*DPR); tbRun.height = Math.round(h*DPR); }
  tbCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
  tbCtx.clearRect(0, 0, w, h);
  const run = gameState === "play" && left > 0;
  const sp = hurry ? 16 : 9;                            // のこり すこしで 足が はやく なる
  const hop = run ? Math.abs(Math.sin(time*sp))*6 : 0;
  const r = h*.30;
  tbCtx.globalAlpha = .18; tbCtx.fillStyle = "#6a5040";
  tbCtx.beginPath(); tbCtx.ellipse(w/2, h - 5, r*.8, r*.22, 0, 0, 7); tbCtx.fill(); tbCtx.globalAlpha = 1;
  tbCtx.save(); tbCtx.translate(w/2, h - 5 - r - hop);
  if (run) tbCtx.rotate(-(.12 + Math.sin(time*sp)*.1));          // 左へ 走って いる かたむき
  drawCreature(tbCtx, LAST, r, time*3, 1, 0, run ? 1 : 0, 0, 1);
  tbCtx.restore();
}
function setText(el, v){ v = String(v); if (el && el.textContent !== v) el.textContent = v; }

let endReason = "time";
function endGame(reason){
  if (gameState !== "play") return;
  endReason = reason || "time";
  gameState = "end"; endT = 0; started = false; fever = null;
  if (endReason === "over"){
    // あふれた（本体の「こえちゃった！」と おなじ）。下がる 音で しめる
    fx.push({ t:"txt", u:0, v:0, h:220, s:"こえちゃった！", life:1.8, age:0, c:"#e0405f", size:32 });
    [659, 587, 523, 440].forEach((f, i) => setTimeout(() => beep(f, .2, "triangle", .1, .9), i*150));
    for (const b of balls) if (b.state === "ok") makeShock(b, rnd(0, .2), .8, 1);
  } else {
    fx.push({ t:"txt", u:0, v:0, h:220, s:"おつかれさま！", life:1.6, age:0, c:"#e0668a", size:32 });
    [784, 659, 523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .16, "triangle", .1), i*110));
    for (const b of balls) if (b.state === "ok") makeSmile(b, 3);
  }
}
/* あふれ チェック（第8版）：ほかの子の 上に のった まま（OVER_H より 高い）OVER_WAIT 秒 たつと、
   その子の 上に 3・2・1。0 で おしまい。子ごとの 時計（本体 設計判断13 と おなじ 考え方）。 */
let overTick = -1, fullT = 0, fillNow = 0;
function fillRatio(){
  let a = 0;
  for (const b of balls) if (b.state === "ok" || b.state === "merge") a += b.r*b.r;
  return a / (R*R);                                  // どの 形も 面積は πR² に そろえて ある
}
/* ほかの 子の 上に のって いるか：ゆかから 浮いて いて、下に ふれて いる 子が いる（とんで いる だけ では ない） */
function onTop(b){
  // 「上に のって いる」＝ ゆかから じゅうぶん 浮いて いて、下の 子との ふれる 向きが 上むき。
  // （よこから ぎゅっと はさまれて すこし 浮いた だけ では 数えない。第10版：かべぎわに 寄せた だけで 20秒で おわった）
  if (b.h < Math.max(OVER_H, b.r*.35) || Math.abs(b.vh) > 220) return false;
  const yb = b.h + b.r;
  for (const o of balls){
    if (o === b || o.state !== "ok") continue;
    const yo = o.h + o.r;
    if (yo >= yb) continue;
    const d = Math.hypot(b.u - o.u, b.v - o.v, yb - yo);
    if (d < b.r + o.r + 3 && (yb - yo)/d > .55) return true;
  }
  return false;
}
function stepOver(dt){
  fillNow += (fillRatio() - fillNow) * Math.min(1, dt*4);   // ちらつかない ように すこし なめらかに
  if (gameState !== "play") return;
  let worst = 99;
  // 第9版：あふれ ＝ **ほかの 子の 上に のった まま**（作者：「こえちゃった」の 線が 分からない。のった 状態で よい）。
  // 上に のって いる 子の 頭の 上に 3・2・1。すべり おりれば（傾けて 場所を あければ）カウントは 消える。
  // （第8版の「お盆の 広さの 5わり」は 目で 見えない 線 だったので やめた）
  for (const b of balls){
    if (b.state !== "ok"){ b.overT = 0; continue; }
    if (onTop(b)) b.overT = (b.overT || 0) + dt;
    else b.overT = Math.max(0, (b.overT || 0) - dt*4);
    if (b.overT > OVER_WAIT){
      const left = OVER_SEC - (b.overT - OVER_WAIT);
      worst = Math.min(worst, left);
      if (left <= 0){ endGame("over"); return; }
    }
  }
  for (const w of waiters) worst = Math.min(worst, OVER_SEC - w.t);
  const sec = worst < 99 ? Math.ceil(worst) : -1;
  if (sec !== overTick){ overTick = sec; if (sec > 0) beep(sec === 1 ? 988 : 784, .08, "square", .06); }
}
function bestKey(){ return "mamemaru3d-best-" + limit; }
function showResult(){
  const sc = scoreNow();
  let best = 0;
  try { best = +localStorage.getItem(bestKey()) || 0; } catch(e){}
  const isNew = sc > best;
  if (isNew){ best = sc; try { localStorage.setItem(bestKey(), String(sc)); } catch(e){} }
  document.getElementById("resMode").textContent = limit ? (limit/60) + "分" : "無制限（" + fmt(playT) + "）";
  document.getElementById("resScore").textContent = sc;
  document.querySelector("#result .rt").textContent = endReason === "over" ? "こえちゃった！" : "おつかれさま！";
  document.getElementById("resPop").textContent = popScore + "点（" + sends + "組）";
  document.getElementById("resChain").textContent = chainScore + "点";
  document.getElementById("resClear").textContent = clearScore + "点（" + clears + "回）";
  document.getElementById("resBest").textContent = isNew ? "最高記録！ " + best + "点" : "最高 " + best + "点";
  document.getElementById("resBest").classList.toggle("new", isNew);
  document.getElementById("result").classList.add("show");
}
function resetGame(){
  balls = []; pending = []; merges = []; runners = []; fx = []; outs = []; ww = null; wwT = WW_EVERY*.7;
  chainLive = null; sends = 0; playT = 0; popScore = 0; chainScore = 0; clearScore = 0; clears = 0;
  fever = null; nextFever = FEVER_EVERY; lastTick = -1; fullT = 0; fillNow = 0; overTick = -1; endReason = "time";
  nextQ.length = 0; nextQ.push(pickDrop(), pickDrop()); nextDirty = true;
  SCALE = 1; geomScale = 1; brickT = BRICK_FIRST; waiters = [];
  applyTheme(pick(THEMES)); buildShape(pick(SHAPES));
}
function startGame(){
  disarmQuit();
  applySelected();
  resetGame();
  gameState = "play"; started = true;
  document.getElementById("start").classList.add("hidden");
  document.getElementById("result").classList.remove("show");
  document.getElementById("nextCard").classList.remove("hidden");
  document.getElementById("hud").classList.remove("hidden");
  document.getElementById("tools").style.display = "";
  tbBox.classList.remove("hidden"); tbColKey = "";
  document.getElementById("quitBtn").style.display = "";
  for (let i = 0; i < 5; i++) setTimeout(() => { if (gameState === "play") queueSpawn(); }, 250 + i*380);   // さいしょの 5人
  spawnT = .25 + 5*.38 + SPAWN_EVERY;
  toast(TH.nm + "・" + SH.nm + "のお盆");
}
function goHome(){
  gameState = "home"; started = false;
  document.getElementById("result").classList.remove("show");
  document.getElementById("hud").classList.add("hidden");
  document.getElementById("nextCard").classList.add("hidden");
  document.getElementById("tools").style.display = "none";   // ホームでは ボタンを かくす（はじめの 画面の 字と かさなる）
  tbBox.classList.add("hidden");
  document.getElementById("quitBtn").style.display = "none";
  document.getElementById("start").classList.remove("hidden");
  paintLimit();
}
function paintLimit(){
  document.querySelectorAll("#limitRow button").forEach(b => b.classList.toggle("on", +b.dataset.l === limit));
  let best = 0; try { best = +localStorage.getItem(bestKey()) || 0; } catch(e){}
  document.getElementById("homeBest").textContent = best ? "最高 " + best + "点" : "";
}
document.querySelectorAll("#limitRow button").forEach(b => b.addEventListener("click", () => {
  limit = +b.dataset.l;
  try { localStorage.setItem("mamemaru3d-limit", String(limit)); } catch(e){}
  paintLimit();
}));
document.getElementById("againBtn").addEventListener("click", () => { beep(660, .06, "sine", .05); startGame(); });
document.getElementById("homeBtn").addEventListener("click", goHome);
/* 「やめる」は 2だんかい（本体と おなじ）。1回目は 文字が「本当？」に かわるだけ。2.2秒で もどる */
const quitBtn = document.getElementById("quitBtn");
let quitArm = 0;
function disarmQuit(){ quitArm = 0; quitBtn.textContent = "やめる"; quitBtn.classList.remove("arm"); }
quitBtn.addEventListener("click", () => {
  if (gameState !== "play") return;
  if (quitArm > 0){ disarmQuit(); endGame("quit"); return; }
  quitArm = 2.2; quitBtn.textContent = "本当？"; quitBtn.classList.add("arm");
  beep(420, .08, "sine", .06);
});
paintLimit();

/* ============================================================
   キャラえらび（第7版・本体と おなじ しくみ）
   ------------------------------------------------------------
   ・えらべるのは 15体 ＋ 解放ずみの シークレット（本体の あいことばで 解放した もの。
     同じ サイト（tenfivetwo.github.io）なら 本体の 記録を そのまま 読む）。
   ・6体を えらんだ 順に 大きさの はしご SIZE_LADDER を かぶせる。先に えらんだ子ほど 大きい。
   ・中身（ぶつり・点数）は どの 6体でも 同じ。変わるのは 絵だけ（本体 設計判断）。
   ・保存先は 3D だけの `mamemaru3d-selected-chars`（本体の えらびを こわさない）。
   ・いちばん 小さい子は TIERS[LAST]。見送り・にじいろ・時間バーの 走る子は ぜんぶ ここを 見る。
   ============================================================ */
/* 解放ずみの シークレットだけ えらべる（本体と おなじ。unlockedChars は 本体の 記録 mamemaru-unlocked） */
function isUsable(c){ return !c || !c.secret || unlockedChars.indexOf(c.name) >= 0; }
let chosen = null;          // えらんだ 6体（ALL_CHARACTERS の 要素）
try {
  const names = JSON.parse(localStorage.getItem("mamemaru3d-selected-chars") || "null");
  if (Array.isArray(names)){
    const cs = names.map(n => ALL_CHARACTERS.find(c => c.name === n)).filter(c => c && isUsable(c));
    if (cs.length === 6) chosen = cs;
  }
} catch(e){}
function applySelected(){
  const set = chosen || DEFAULT_TIERS;
  TIERS.length = 0;
  set.forEach((c, i) => TIERS.push(Object.assign({}, c, { r: SIZE_LADDER[i] })));
  LAST = TIERS.length - 1;
  nextDirty = true;
}
/* drawCreature は TIERS[i] を 見るので、見本を えがく あいだだけ 入れかえて かならず もどす */
function withTiers(list, fn){
  const bk = TIERS.slice();
  TIERS.length = 0; list.forEach(c => TIERS.push(c));
  try { fn(); } finally { TIERS.length = 0; bk.forEach(c => TIERS.push(c)); }
}
function drawIcon(cv, list, i, r, size){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = size*dpr; cv.height = size*dpr; cv.style.width = size + "px"; cv.style.height = size + "px";
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.translate(size/2, size/2);
  withTiers(list, () => { try { drawCreature(g, i, r, i*1.3, 1, 0, .6, 0, 1); } catch(e){} });
}
/* ホームの「いまの 顔ぶれ」 */
function paintLineup(){
  const row = document.getElementById("lineup");
  row.textContent = "";
  const set = (chosen || DEFAULT_TIERS).map((c, i) => Object.assign({}, c, { r: SIZE_LADDER[i] }));
  const S = 17 / SIZE_LADDER[0];
  set.forEach((c, i) => {
    const cv = document.createElement("canvas");
    drawIcon(cv, set, i, SIZE_LADDER[i]*S, 40);
    row.appendChild(cv);
  });
}
function openCharSel(){
  const layer = document.getElementById("charSel");
  const grid = document.getElementById("csGrid"), order = document.getElementById("csOrder");
  const okBtn = document.getElementById("csOk"), cnt = document.getElementById("csCount");
  const picked = (chosen || []).map(c => ALL_CHARACTERS.indexOf(c)).filter(i => i >= 0);
  grid.textContent = "";
  const paint = () => {
    cnt.textContent = "選んだ数 " + picked.length + " / 6";
    okBtn.disabled = picked.length !== 6;
    grid.querySelectorAll(".cc").forEach(el => {
      const n = picked.indexOf(+el.dataset.ci);
      el.classList.toggle("on", n >= 0);
      el.querySelector(".no").textContent = n < 0 ? "" : String(n + 1);
    });
    order.textContent = "";
    if (!picked.length){ order.innerHTML = '<div class="empty">選ぶとここに並びます</div>'; return; }
    const set = picked.map((k, i) => Object.assign({}, ALL_CHARACTERS[k], { r: SIZE_LADDER[i] }));
    const S = 20 / SIZE_LADDER[0];
    set.forEach((c, i) => {
      if (i){ const a = document.createElement("span"); a.className = "arw"; a.textContent = "▸"; order.appendChild(a); }
      const cv = document.createElement("canvas");
      drawIcon(cv, set, i, SIZE_LADDER[i]*S, 44);
      order.appendChild(cv);
    });
  };
  ALL_CHARACTERS.forEach((c, idx) => {
    if (!isUsable(c)) return;                      // 解放して いない シークレットは カードを 作らない
    const card = document.createElement("div");
    card.className = "cc" + (c.secret ? " sec" : ""); card.dataset.ci = idx;
    const cv = document.createElement("canvas");
    drawIcon(cv, ALL_CHARACTERS, idx, 22, 56);
    const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = c.name;
    const no = document.createElement("div"); no.className = "no";
    card.append(cv, nm, no);
    card.addEventListener("click", () => {
      const k = picked.indexOf(idx);
      if (k >= 0) picked.splice(k, 1);
      else if (picked.length < 6) picked.push(idx);
      else return;
      beep(k >= 0 ? 520 : 700, .05, "sine", .05);
      paint();
    });
    grid.appendChild(card);
  });
  okBtn.onclick = () => {
    if (picked.length !== 6) return;
    chosen = picked.map(k => ALL_CHARACTERS[k]);
    try { localStorage.setItem("mamemaru3d-selected-chars", JSON.stringify(chosen.map(c => c.name))); } catch(e){}
    closeCharSel();
  };
  document.getElementById("csDef").onclick = () => {    // もとの 6体に もどす
    picked.length = 0; DEFAULT_TIERS.forEach(c => picked.push(ALL_CHARACTERS.indexOf(c))); paint();
  };
  document.getElementById("csCancel").onclick = closeCharSel;   // なにも 保存しない
  paint();
  layer.classList.remove("hidden");
}
function closeCharSel(){
  document.getElementById("charSel").classList.add("hidden");
  applySelected(); paintLineup();
}
document.getElementById("pickBtn").addEventListener("click", openCharSel);
applySelected();
paintLineup();

/* 持ち方の 基準を えらぶ（はじめの 画面） */
function paintBase(){
  document.querySelectorAll("#baseRow button").forEach(b => b.classList.toggle("on", b.dataset.m === baseMode));
}
document.querySelectorAll("#baseRow button").forEach(b => b.addEventListener("click", () => {
  baseMode = b.dataset.m; saveBase(); applyBase();
}));
paintBase();
document.getElementById("startBtn").addEventListener("click", async () => {
  beep(660, .06, "sine", .05);           // 音を 起こす（指で さわった ながれで）
  await enableSensor();
  startGame();
});

applyTheme(pick(THEMES));
buildShape(pick(SHAPES));
addEventListener("resize", resize);
resize();
requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });

/* 確かめ用（絵を 撮る 道具から さわる）。遊びには 関係ない */
window.__m3d = {
  _waiter(t, lock){ _noSpot = !!lock; makeWaiter({ tier:t, r:TIERS[t].r }); },
  add(tier, u, v, h){ const b = newBall(tier, u, v); b.age = 1; if (h) b.h = h; balls.push(b); return b; },
  clear(){ balls = []; pending = []; merges = []; runners = []; fx = []; chainLive = null; outs = []; ww = null; },
  ww(u, v){ return spawnWW(u, v); }, get wwObj(){ return ww; }, get outs(){ return outs; }, get obs(){ return OBS; }, get gap(){ return gap; },
  obs0(list){ OBS = list.map(([u, v]) => ({ u, v, r:OB_R, ph:0 })); },
  tilt(u, v, now){ testTilt = { u, v }; if (now){ tilt.u = u; tilt.v = v; } },
  free(){ testTilt = null; },
  get balls(){ return balls; }, get runners(){ return runners; }, get fx(){ return fx; },
  step(n, dt){ for (let i = 0; i < n; i++){ update(dt || 1/60); drawNext(dt || 1/60); } draw(); },
  scene(ti, si, ga){ applyTheme(THEMES[ti]); buildShape(SHAPES[si], ga); },
  swap(ti, si){ changeScene(ti, si); },
  wall(u, v){ return wallInfo(u, v); }, wallX(u, v){ return wallDistExact(u, v); }, get IN(){ return IN; },
  shapes: SHAPES.map(s => s.nm), themes: THEMES.map(t => t.nm),
  start(){ document.getElementById("startBtn").click(); },
  stop(){ running = false; },
  quiet(){ started = false; },
  brick(u, v){ const b = newBrick(u, v); b.age = 1; balls.push(b); return b; }, jama(u, v){ const b = newJama(u, v); b.age = 1; balls.push(b); return b; }, get bricks(){ return balls.filter(b => b.brick).length; },
  get faceTex(){ return faceTex.toDataURL(); }, qOf(i){ return balls[i] && balls[i].q; },
  pick(){ openCharSel(); }, setChosen(names){ chosen = names.map(n => ALL_CHARACTERS.find(c => c.name === n)); applySelected(); paintLineup(); }, get tierNames(){ return TIERS.map(t => t.name); },
  drawC(g, t, r, ph){ drawCreature(g, t, r, ph, 1, 0, .6, 0, 1); }, get theme(){ return C; }, get timeLeft(){ return limit ? limit - playT : playT; },
  fever(){ startFever(); }, sparkle(b){ makeSparkle(b); }, clearAll(u, v){ clearAll(u, v); },
  get score(){ return [popScore, chainScore, clearScore]; }, get waiters(){ return waiters.length; }, get endReason(){ return endReason; }, get fill(){ return fillNow; }, get scale(){ return SCALE; }, get fullT(){ return fullT; }, get dbg(){ return { fever, pending: pending.length, started, spawnT, playT, nextFever }; }, get state(){ return gameState; }, setPlayT(t){ playT = t; }, end(){ endGame(); },
  get tiltT(){ return { u: tiltT.u, v: tiltT.v }; }, get base(){ return [baseMode, sensor.x0, sensor.y0]; },
};
