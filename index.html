let SCALE = 1;            // お盆の いまの 大きさ（第9版：ふちが せまる。見送りで すこし もどる）
function rhoAt(a){ return SH.rho(a) * SHK * SCALE; }
function buildShape(sh, gapAng){
  SH = sh;
  // 面積を はかって 倍率を きめる
  let A = 0;
  const M = 720;
  for (let i = 0; i < M; i++){ const r = sh.rho(i/M*6.2832); A += .5*r*r*(6.2832/M); }
  SHK = Math.sqrt(Math.PI*R*R / A);
  // 切れ目の 場所（おくがわの どこか。ハートは まんなかが くぼみ なので よける）
  gap.ang = (gapAng !== undefined) ? gapAng : pick(sh.nm === "ハート" ? [-.75, -2.39] : [-1.5708, -.75, -2.39]);
  buildGeom();
  placeObstacles();
  if (W) fitView();
}
/* いまの SCALE で ふち・門・切れ目・みずたまを 作りなおす（ちぢむ たびに よぶ） */
function buildGeom(){
  IN = []; OUT = []; NRM = [];
  for (let i = 0; i < N_SEG; i++){
    const a = i/N_SEG*6.2832, r = rhoAt(a);
    IN.push({ u:Math.cos(a)*r, v:Math.sin(a)*r });
  }
  for (let i = 0; i < N_SEG; i++){
    const p0 = IN[(i + N_SEG - 1) % N_SEG], p1 = IN[i], p2 = IN[(i + 1) % N_SEG];
    // 左右の 辺の 外むきの 向きを 足す
    const e1u = p1.u - p0.u, e1v = p1.v - p0.v, e2u = p2.u - p1.u, e2v = p2.v - p1.v;
    const l1 = Math.hypot(e1u, e1v) || 1, l2 = Math.hypot(e2u, e2v) || 1;
    let nu = e1v/l1 + e2v/l2, nv = -e1u/l1 - e2u/l2;
    const l = Math.hypot(nu, nv) || 1; nu /= l; nv /= l;
    NRM.push({ u:nu, v:nv });
    OUT.push({ u:p1.u + nu*RIM_W, v:p1.v + nv*RIM_W });
  }
  // 門と 切れ目
  for (const gt of gates.concat([gap])){
    const a = gt.ang, r = rhoAt(a);
    const P = { u:Math.cos(a)*r, v:Math.sin(a)*r };
    const e = .004, ra = rhoAt(a - e), rb = rhoAt(a + e);
    const tu = Math.cos(a + e)*rb - Math.cos(a - e)*ra, tv = Math.sin(a + e)*rb - Math.sin(a - e)*ra;
    const tl = Math.hypot(tu, tv);
    gt.P = P; gt.t = { u:tu/tl, v:tv/tl }; gt.n = { u:tv/tl, v:-tu/tl };
  }
  SEG_GATE = []; SEG_GAP = [];
  for (let i = 0; i < N_SEG; i++){
    const p = IN[i], q = IN[(i + 1) % N_SEG];
    const mu = (p.u + q.u)/2, mv = (p.v + q.v)/2;
    let g = false;
    for (const gt of gates){
      const du = mu - gt.P.u, dv = mv - gt.P.v;
      if (Math.abs(du*gt.t.u + dv*gt.t.v) < GATE_HALF && Math.abs(du*gt.n.u + dv*gt.n.v) < 30) g = true;
    }
    SEG_GATE.push(g);
    const du = mu - gap.P.u, dv = mv - gap.P.v;
    SEG_GAP.push(GAP_ON && Math.abs(du*gap.t.u + dv*gap.t.v) < GAP_HALF && Math.abs(du*gap.n.u + dv*gap.n.v) < 30);
  }
  SEG_OPEN = SEG_GATE.map((g, i) => g || SEG_GAP[i]);
  // みずたま（形の 中だけ）
  DOTS = [];
  let row = 0;
  for (let v = -R*1.3; v <= R*1.3; v += 38, row++)
    for (let u = -R*1.4 + (row % 2 ? 19 : 0); u <= R*1.4; u += 38)
      if (wallInfo(u, v).dist > 12) DOTS.push({ u, v, s:5.5 });
}
/* じゃまな 柱（第4版で きめ方を かえた・作者の 注文12）
   すきまは「0」か「らいおんが 通れる はば（OB_PASS）いじょう」の どちらか だけ。
   ・ふちに くっつけた 柱（ふちの 出っぱり）… ふちとの あいだに すきまは ない
   ・まんなかの ほうの 柱 …………………… ふちまで OB_PASS いじょう あける
   柱どうしも OB_PASS いじょう はなす。「大きい子だけ 通れない 道」で 詰まる 絵を 作らない。 */
/* ふちまでの ほんとうの きょり（ぜんぶの 辺を しらべる。柱を 置く ときだけ つかう）。
   wallInfo は 電池のため 近道を して いて、まんなか ふきんでは 大きめの 値を かえす
   （第6版で 発覚：ハートの くぼみと まんなかの 柱の あいだが せまいのに 通って いた）。 */
function wallDistExact(u, v){
  let best = 1e9;
  for (let i = 0; i < N_SEG; i++){
    const p = IN[i], q = IN[(i + 1) % N_SEG];
    const eu = q.u - p.u, ev = q.v - p.v;
    const t = clamp(((u - p.u)*eu + (v - p.v)*ev) / (eu*eu + ev*ev), 0, 1);
    best = Math.min(best, Math.hypot(u - p.u - eu*t, v - p.v - ev*t));
  }
  return best;
}
function obstacleOK(o, list){
  if (o.onRim){
    // ふちに 半分 うまって いる。「むかいがわ」の ふちとは OB_PASS いじょう あける。
    // むかいがわ ＝ 柱と その ふちの 点を むすんだ 線の まんなかが、お盆の 中ほどに ある もの
    // （となりの ふち に そった 点は、線の まんなかが ふちの すぐ そば なので のぞく）。
    for (const q of IN){
      const d = Math.hypot(q.u - o.u, q.v - o.v);
      if (d >= o.r + OB_PASS) continue;
      if (wallDistExact((q.u + o.u)/2, (q.v + o.v)/2) > 26) return false;
    }
  } else if (wallDistExact(o.u, o.v) - o.r < OB_PASS) return false;
  for (const p of list) if (Math.hypot(p.u - o.u, p.v - o.v) - p.r - o.r < OB_PASS) return false;
  for (const gt of gates.concat([gap])) if (Math.hypot(gt.P.u - o.u, gt.P.v - o.v) < 120) return false;
  return true;
}
/* お盆が ちぢむ（第9版）。柱も いっしょに 中へ よる。
   すきまが らいおんの 通れない はばに なった 柱は、ゆかに しずんで 消える（注文12 を まもる）。 */
let geomScale = 1, viewScale = 1;
function applyScale(){
  geomScale = SCALE;
  buildGeom();
  if (Math.abs(SCALE - viewScale) > .02 && W) fitView();
  for (const o of OBS){ o.u = o.bu*SCALE; o.v = o.bv*SCALE; }
  for (let i = OBS.length - 1; i >= 0; i--){
    const o = OBS[i];
    let bad = false;
    if (o.onRim){
      for (const q of IN){
        const d = Math.hypot(q.u - o.u, q.v - o.v);
        if (d < o.r + OB_PASS && wallDistExact((q.u + o.u)/2, (q.v + o.v)/2) > 26){ bad = true; break; }
      }
    } else if (wallDistExact(o.u, o.v) - o.r < OB_PASS) bad = true;
    for (const p of OBS) if (p !== o && Math.hypot(p.u - o.u, p.v - o.v) - p.r - o.r < OB_PASS) bad = true;
    if (bad){
      OBS.splice(i, 1);
      dust(o.u, o.v, o.r, 8);
      beep(330, .15, "sine", .04, .6);
    }
  }
}
const SHRINK_ON = false;   // 第10版：ふちが せまるのは やめた（せまいと となりに おなじ子が いて、何も しなくても 連鎖で 消えて しまう）
function stepShrink(dt){
  if (!SHRINK_ON || gameState !== "play") return;
  SCALE = Math.max(SHRINK_MIN, SCALE - SHRINK_RATE*dt);
  if (Math.abs(SCALE - geomScale) > .003) applyScale();
}
function growBack(k){
  if (!SHRINK_ON) return;
  SCALE = Math.min(1, SCALE + k);
  applyScale();
}
function placeObstacles(){
  OBS = [];
  // まんなかに 1つ（お盆が ドーナツの ように なる）
  for (let k = 0; k < 120 && OBS.length < 1; k++){
    const o = { u: rnd(-12, 12), v: rnd(-12, 12), r:OB_R, ph: rnd(0, 6), onRim:false };
    if (obstacleOK(o, OBS)) OBS.push(o);
  }
  // まんなかに 置けない 形（ハートは くぼみが 近い）では、置ける ところを さがす
  for (let k = 0; k < 300 && OBS.length < 1; k++){
    const a = rnd(0, 6.2832), d = Math.sqrt(Math.random()) * rhoAt(a);
    const o = { u: Math.cos(a)*d, v: Math.sin(a)*d, r:OB_R, ph: rnd(0, 6), onRim:false };
    if (obstacleOK(o, OBS)) OBS.push(o);
  }
  // のこりは ふちの 出っぱり
  for (let k = 0; k < 600 && OBS.length < OB_N; k++){
    const a = rnd(0, 6.2832), r = rhoAt(a);
    const d = r - OB_R*.55;                          // 半分 ちょっと ふちに うめる → すきま なし
    const o = { u: Math.cos(a)*d, v: Math.sin(a)*d, r:OB_R, ph: rnd(0, 6), onRim:true };
    if (wallInfo(o.u, o.v).dist > OB_R*.8) continue;  // くぼんだ ところは さける
    // ふちが 内がわへ へこんで いる ところ（ハートの まんなかの くぼみ）には 置かない
    const ii = Math.round(a/6.2832*N_SEG) % N_SEG;
    const p0 = IN[(ii - 4 + N_SEG) % N_SEG], p1 = IN[ii], p2 = IN[(ii + 4) % N_SEG];
    if ((p1.u - p0.u)*(p2.v - p1.v) - (p1.v - p0.v)*(p2.u - p1.u) < 0) continue;
    if (obstacleOK(o, OBS)) OBS.push(o);
  }
  for (const o of OBS){ o.bu = o.u/SCALE; o.bv = o.v/SCALE; }   // ちぢむ ときの もとの いち
  for (const b of balls) for (const o of OBS){      // かさなった 子は よける
    const d = Math.hypot(b.u - o.u, b.v - o.v);
    if (d < b.r + o.r){ const k2 = (b.r + o.r + 1)/(d || 1); b.u = o.u + (b.u - o.u)*k2; b.v = o.v + (b.v - o.v)*k2; }
  }
}
/* ふちまでの きょり（中が プラス）と、中むきの 向き */
function wallInfo(u, v, skipGap){
  // 電池のため：ふちから 十分 はなれて いれば こまかく はからない。
  // 近い ときも、その 子の 方向の まわり（±20こま）だけ しらべる。
  const ang = Math.atan2(v, u), L = Math.hypot(u, v), rr = rhoAt(ang);
  if (rr - L > 130) return { dist: rr - L, nu: -u/(L || 1), nv: -v/(L || 1) };
  const i0 = Math.round(((ang + 6.2832) % 6.2832) / 6.2832 * N_SEG);
  let best = 1e9, bu = 0, bv = 0;
  for (let k = -20; k <= 20; k++){
    const i = (i0 + k + N_SEG) % N_SEG;
    if (skipGap && SEG_GAP[i]) continue;
    const p = IN[i], q = IN[(i + 1) % N_SEG];
    const eu = q.u - p.u, ev = q.v - p.v;
    const t = clamp(((u - p.u)*eu + (v - p.v)*ev) / (eu*eu + ev*ev), 0, 1);
    const cu = p.u + eu*t, cv2 = p.v + ev*t;
    const d = (u - cu)*(u - cu) + (v - cv2)*(v - cv2);
    if (d < best){ best = d; bu = cu; bv = cv2; }
  }
  const d = Math.sqrt(best);
  const inside = L < rr;
  let nu, nv;
  if (d < 1e-6){ const l = Math.hypot(u, v) || 1; nu = -u/l; nv = -v/l; }
  else if (inside){ nu = (u - bu)/d; nv = (v - bv)/d; }
  else { nu = (bu - u)/d; nv = (bv - v)/d; }
  return { dist: inside ? d : -d, nu, nv };
}

/* ---------------- 門 ---------------- */
const gates = [{ side:-1, ang: Math.PI - GATE_A, open:0 }, { side:1, ang: GATE_A, open:0 }];
function gateOf(side){ return side > 0 ? gates[1] : gates[0]; }
/* 門の 近くの 点：off＝ふちから 外への きょり（中は マイナス）、t＝ふちに そって よこへ */
function gpt(gt, off, t){
  return { u: gt.P.u + gt.n.u*off + gt.t.u*t, v: gt.P.v + gt.n.v*off + gt.t.v*t };
}

}

/* 第8版：時間が たつほど 大きい子が ふえる（作者が えらんだ「あふれる しくみ」）。

const BIG_T = 180;
function pickDrop(){
  const k = 0;   // 第9版：大きい子を ふやすのは やめた（おなじ子が となり あいやすく なり、かえって くっつきやすかった）

let AC = null, soundOn = true;
function beep(freq, dur, type, vol, slide){

function findSpot(r, tierOf){

          dust(b.u, b.v, b.r, 6);
          beep(170 + (LAST - b.tier)*24, .07, "sine", .05);
          for (const o of balls) if (o !== b && o.state === "ok" && Math.hypot(o.u-b.u, o.v-b.v) < b.r + o.r + 40){
            makeShock(o, rnd(0, .06), .32, 1);
            if (o.h <= 0) o.vh = Math.max(o.vh, 110);      // まわりの 子も ちょっと はねる
          }
        }
        continue;
      }
      if (b.state !== "ok") continue;
      const gk = (b.brick && !b.jama) ? .55 : 1;                 // レンガは 転がらず すべる ので 重たい
      b.vu += G_ROLL * gk * tilt.u * h;
      b.vv += G_ROLL * gk * tilt.v * h;
      const ground = b.h <= 0 && b.vh <= 0;
      const sp = Math.hypot(b.vu, b.vv);
      const dec = ground ? ((b.brick && !b.jama) ? (ROLL_RES*3*h + sp*DRAG*2.2*h) : (ROLL_RES*h + sp*DRAG*h)) : sp*.12*h;
      if (sp <= dec){ b.vu = 0; b.vv = 0; }
      else {
        let k = (sp - dec) / sp;
        if (sp*k > V_MAX) k = V_MAX / sp;
        b.vu *= k; b.vv *= k;
      }
      b.u += b.vu*h; b.v += b.vv*h;
      if (!ground){
        b.vh -= GRAV*h; b.h += b.vh*h;
        if (b.h <= 0) landed(b);
        if (b.h + 2*b.r > CEIL){ b.h = CEIL - 2*b.r; if (b.vh > 0) b.vh = -b.vh*.5; }
      }
      b.roll += b.vu / b.r * h;
    }
    // 子どうし（球）
    for (let i = 0; i < balls.length; i++){
      const a = balls[i]; if (a.state === "fall") continue;
      for (let j = i+1; j < balls.length; j++){
        const b = balls[j]; if (b.state === "fall") continue;
        const du = b.u - a.u, dv = b.v - a.v, dy = (b.h + b.r) - (a.h + a.r);
        const rr = a.r + b.r;
        const d2 = du*du + dv*dv + dy*dy;
        if (d2 >= (rr + MERGE_PAD)*(rr + MERGE_PAD)) continue;
        const d = Math.sqrt(d2) || 0.01;
        if (a.tier === b.tier && !a.brick && a.state === "ok" && b.state === "ok" && a.age > .18 && b.age > .18 && !(a.noMerge > 0) && !(b.noMerge > 0)){
          startMerge(a, b); continue;
        }
        if (a.state !== "ok" || b.state !== "ok") continue;
        if (d >= rr) continue;
        const nu = du/d, nv = dv/d, ny = dy/d;
        const pen = rr - d;
        const ia = 1/a.m, ib = 1/b.m, it = ia + ib;
        a.u -= nu*pen*ia/it; a.v -= nv*pen*ia/it; a.h = Math.max(0, a.h - ny*pen*ia/it);
        b.u += nu*pen*ib/it; b.v += nv*pen*ib/it; b.h = Math.max(0, b.h + ny*pen*ib/it);
        const vn = (b.vu - a.vu)*nu + (b.vv - a.vv)*nv + (b.vh - a.vh)*ny;
        if (vn < 0){
          const j2 = -(1 + E_BALL)*vn / it;
          a.vu -= j2*nu*ia; a.vv -= j2*nv*ia; a.vh -= j2*ny*ia;
          b.vu += j2*nu*ib; b.vv += j2*nv*ib; b.vh += j2*ny*ib;
          if (a.h <= 0 && a.vh < 0) a.vh = 0;
          if (b.h <= 0 && b.vh < 0) b.vh = 0;
          if (-vn > 200) bump(a, b, -vn);
        }
      }
    }
    // 見送りの 2匹は、とおり道を あけて もらう（そっと おしのける）
    for (const g of runners){
      if (g.stage > 2) continue;
      for (const q of runnerPos(g)){
        for (const b of balls){
          if (b.state !== "ok") continue;
          const du = b.u - q.u, dv = b.v - q.v;
          const need = b.r + TIERS[LAST].r*1.1;
          const d = Math.hypot(du, dv);
          if (d < need && d > .01){
            const push = (need - d) * .35;
            b.u += du/d*push; b.v += dv/d*push;
          }
        }
      }
    }
    // じゃまな 柱（高さに かかわらず はね返す）
    for (const b of balls){
      if (b.state !== "ok") continue;
      for (const o of OBS){
        const du = b.u - o.u, dv = b.v - o.v, d = Math.hypot(du, dv), need = b.r + o.r;
        if (d >= need || d < .01) continue;
        const nu = du/d, nv = dv/d;
        b.u = o.u + nu*need; b.v = o.v + nv*need;
        const vin = -(b.vu*nu + b.vv*nv);
        if (vin > 0){
          b.vu += (1 + E_RIM)*vin*nu; b.vv += (1 + E_RIM)*vin*nv;
          if (vin > 150){
            kick(b, -Math.min(2.2, vin/280));
            if (b.hitCool <= 0){ makeShock(b, 0, .28, 1); b.hitCool = .6; }
            if (thudCool <= 0){ beep(260, .05, "triangle", .04, .9); thudCool = .08; }
          }
        }
      }
    }
    // ふち ＝ 見えない壁（高さに かかわらず はね返す）。切れ目だけは 小さい子が とおれる
    for (const b of balls){
      if (b.state !== "ok") continue;
      if (GAP_ON && 2*b.r < GAP_HALF*2 && gapPass(b)) continue;
      const w = wallInfo(b.u, b.v);
      if (w.dist < b.r){
        const push = b.r - w.dist;
        b.u += w.nu*push; b.v += w.nv*push;
        const vout = -(b.vu*w.nu + b.vv*w.nv);        // 外へ むかう 速さ
        if (vout > 0){
          b.vu += (1 + E_RIM)*vout*w.nu; b.vv += (1 + E_RIM)*vout*w.nv;
          if (vout > 150){
            kick(b, -Math.min(2.4, vout/260));
            if (b.hitCool <= 0){ makeShock(b, 0, .3, 1); b.hitCool = .6; }
            if (thudCool <= 0){ beep(130 + (LAST - b.tier)*16, .06, "sine", .045, .8); thudCool = .08; }
            if (b.h <= 0 && vout > 260) b.vh = Math.max(b.vh, Math.min(260, vout*.28));   // ふちに あたって ぴょん
          }
        }
      }
    }
    for (let i = balls.length - 1; i >= 0; i--) if (balls[i].state === "out") balls.splice(i, 1);
  }
}
function bump(a, b, vn){
  for (const x of [a, b]){
    kick(x, -Math.min(2.2, vn/300));
    if (x.hitCool <= 0){ makeShock(x, 0, .28, 1); x.hitCool = .7; }
  }
  // 小さい ほうが ぴょんと はねる
  const lo = (a.brick && !a.jama) ? b : (b.brick && !b.jama) ? a : (a.r < b.r ? a : b);
  if (lo.h <= 1 && !(lo.brick && !lo.jama)) lo.vh = Math.max(lo.vh, Math.min(VH_MAX*.6, vn*HOP_HIT));
  if (thudCool <= 0){ beep(200 + (LAST - Math.max(a.tier, b.tier))*20, .05, "sine", .04, .85); thudCool = .08; }
}
/* お盆を ぐいっと 持ち上げると、のって いる 子が はねる */
function flick(dt){
  const du = (tilt.u - tiltPrev.u)/dt, dv = (tilt.v - tiltPrev.v)/dt;
  for (const b of balls){
    if (b.state !== "ok") continue;
    const up = -(b.u*du + b.v*dv);          // その 子の 下の ゆかが 上へ うごく 速さ
    if (b.h > 0){ b.ride = 0; continue; }
    if (up > 60) b.ride = Math.max(b.ride, up);
    else if (b.ride > 0){
      const v = Math.min(VH_MAX, b.ride*FLICK_K);
      if (v > 70){ b.vh = v; b.h = .5; kick(b, 1.2); }
      b.ride = 0;
    }
  }
}
/* 連鎖の たね：生まれた ばかりの 子は、近くの なかま（おなじ子）を 引きよせる。
   ふつうの 子どうしも、あと すこしで ふれる くらい 近ければ 弱く 引きあう。 */
function magnet(dt){
  for (let i = 0; i < balls.length; i++){
    const a = balls[i]; if (a.state !== "ok") continue;
    for (let j = i+1; j < balls.length; j++){
      const b = balls[j]; if (b.state !== "ok" || b.tier !== a.tier || b.brick) continue;
      const du = b.u - a.u, dv = b.v - a.v, d = Math.hypot(du, dv) || 1;
      const gap = d - a.r - b.r;
      let acc = 0;
      const fresh = (a.chain > 0 && a.age < CHAIN_WINDOW) || (b.chain > 0 && b.age < CHAIN_WINDOW);
      if (fresh && d < MAGNET_R + a.r) acc = MAGNET_A * (1 - Math.max(0, gap)/MAGNET_R);
      // （第8版）ふつうの 子どうしの 弱い 引きあいは やめた。くっつく きょり MERGE_PAD で 十分
      if (acc <= 0) continue;
      a.vu += du/d*acc*dt; a.vv += dv/d*acc*dt;
      b.vu -= du/d*acc*dt; b.vv -= dv/d*acc*dt;
    }
  }
}

/* ---------------- 合体 ---------------- */
function startMerge(a, b){
  a.state = "merge"; b.state = "merge";
  merges.push({ a, b, t:0, mu:(a.u + b.u)/2, mv:(a.v + b.v)/2, mh:(a.h + b.h)/2 });
}
function stepMerges(dt){
  for (let i = merges.length-1; i >= 0; i--){
    const m = merges[i];
    m.t += dt;
    const k = 1 - Math.exp(-dt*28);
    for (const x of [m.a, m.b]){
      x.u += (m.mu - x.u)*k; x.v += (m.mv - x.v)*k; x.h += (m.mh - x.h)*k;
    }
    if (m.t >= .11){
      merges.splice(i, 1);
      finishMerge(m);
    }
  }
}
function chainColors(n){       // 本体と おなじ 色
  if (n >= 8) return ["#FF6FA5","#FFD34D","#7FE0FF","#B79BFF"];
  if (n >= 7) return ["#B79BFF","#FF9EDC","#FFD9F2"];
  if (n >= 6) return ["#FF6F9B","#FFA6C6","#FFE3EE"];
  if (n >= 5) return ["#FF9236","#FFC46B","#FFEBC2"];
  return ["#FFC02E","#FFE07A","#FFF6C9"];
}
function finishMerge(m){
  const { a, b, mu, mv, mh } = m;
  balls = balls.filter(x => x !== a && x !== b);
  breakBricksNear(a, b);                          // となりの レンガが くずれる
  const t = a.tier;
  // 連鎖：合体で 生まれた 子が、生まれて すぐ（CHAIN_WINDOW 秒）また くっついた ときだけ 数える。
  const par = [a, b].filter(x => x.chain > 0 && x.age < CHAIN_WINDOW + .3).map(x => x.chain);
  const n = par.length ? Math.max(...par) + 1 : 1;
  if (n >= 2){
    const lo = chainLive ? chainLive.lo : { u:mu, v:mv }, hi = chainLive ? chainLive.hi : { u:mu, v:mv };
    chainLive = { n, u:mu, v:mv, t:time,
                  lo:{ u:Math.min(lo.u, mu), v:Math.min(lo.v, mv) }, hi:{ u:Math.max(hi.u, mu), v:Math.max(hi.v, mv) } };
    const cols = chainColors(n);
    fx = fx.filter(f => !f.chainTxt);          // まえの「連鎖」の 字は けして 1つだけ 出す
    fx.push({ t:"txt", chainTxt:true, u:mu, v:mv, h: 100, s:"連鎖 " + n, life:1.1, age:0, c: darken(cols[0], .38), size: 20 + Math.min(10, n*2) });
    stars(mu, mv, cols, 10, 40, mh);
    fx.push({ t:"ring", u:mu, v:mv, r0:30, r1:110 + n*10, life:.5, age:0, c:cols[0] });
    beep(523.25 * Math.pow(1.122, n - 2), .1, "triangle", .1);
  }

  const boom = a.sparkle || b.sparkle;           // かたほうでも にじいろ なら 全消し（本体と おなじ）
  if (t === LAST){ startRunners(mu, mv); if (boom) clearAll(mu, mv); return; }

  const nb = newBall(t + 1, mu, mv);
  nb.vu = (a.vu + b.vu)/2 * .5; nb.vv = (a.vv + b.vv)/2 * .5;
  nb.h = mh; nb.vh = 290;             // ぽんっと はねて 生まれる
  nb.pop = 0; nb.age = 0; nb.chain = n;
  kick(nb, -2.2);
  makeSmile(nb, 1.5);
  balls.push(nb);
  if (t + 1 === LAST && Math.random() < SPARKLE_RATE) makeSparkle(nb);
  if (boom){ clearAll(mu, mv); return; }
  stars(mu, mv, [TIERS[t].body, "#FFD86B", "#FF9FBB", "#9FD8FF", "#ffffff"], 12, a.r, mh);
  fx.push({ t:"ring", u:mu, v:mv, r0:a.r*.4, r1:a.r*2.0, life:.45, age:0, c:TIERS[t].shade });
  for (const o of balls) if (o !== nb && o.state === "ok" && Math.hypot(o.u-mu, o.v-mv) < a.r*2.4 + o.r)
    makeShock(o, rnd(.02, .1), .3, 1);
  beep(300 + t*95, .12, "sine", .1, .8);   // 小さく なる → 音も 下げる（本体と おなじ）
}
/* 連鎖が とぎれた しゅんかんに どーん（3連鎖から） */
function chainFinale(c){
  const cols = chainColors(c.n);
  const pw = Math.min(2.2, 1 + (c.n - 3)*.3);
  stars(c.u, c.v, cols, 16 + c.n*4, 50, 20, pw);
  fx.push({ t:"ring", u:c.u, v:c.v, r0:40, r1:170*pw, life:.6, age:0, c:cols[0] });
  setTimeout(() => fx.push({ t:"ring", u:c.u, v:c.v, r0:40, r1:230*pw, life:.6, age:0, c:cols[1] }), 70);
  setTimeout(() => fx.push({ t:"ring", u:c.u, v:c.v, r0:40, r1:290*pw, life:.6, age:0, c:cols[2] || "#ffffff" }), 145);
  fx.push({ t:"txt", u:c.u, v:c.v, h:150, s:"すごい！", life:1.5, age:0, c: darken(cols[0], .38), size: 30 });
  if (c.n >= CHAIN_MIN){
    const spread = Math.max(c.hi.u - c.lo.u, c.hi.v - c.lo.v);
    const pts = chainPts(c.n, spread);
    addScore("chain", pts);
    fx.push({ t:"txt", u:c.u, v:c.v, h:110, s:"+" + pts + "点", life:1.5, age:0, c: darken(cols[0], .38), size: 22 });
  }
  flashT = Math.max(flashT, .18); flashSoft = true;
  for (const b of balls){
    makeShock(b, Math.min(.35, Math.hypot(b.u - c.u, b.v - c.v)/900), rnd(.45, .7), 1);
    if (b.h <= 0 && b.state === "ok") b.vh = Math.max(b.vh, rnd(120, 200));   // みんなで ぴょん
  }
  const base = 523.25 * Math.pow(1.06, c.n - 3);
  [1, 1.26, 1.5, 2].forEach((m, i) => setTimeout(() => beep(base*m, .17, "triangle", .12), i*58));
  setTimeout(() => beep(base*3, .32, "sine", .09), 250);
}

/* ---------------- 見送り ---------------- */
// 2匹は ならんで、近いほうの 門へ 走り、門を ぬけて しきものへ おりて、よこへ 走って いく。
// 上へは 昇らせない。弾けさせない。振り返らせない（本体 設計判断3）。
function startRunners(mu, mv){
  const dR = Math.hypot(mu - gates[1].P.u, mv - gates[1].P.v);
  const dL = Math.hypot(mu - gates[0].P.u, mv - gates[0].P.v);
  const side = dR <= dL ? 1 : -1;
  const light = time - lastRunT < 2;
  lastRunT = time;
  runners.push({ side, u:mu, v:mv, hy:0, stage:0, age:0, st:0, ph:rnd(0, 6), fu:side, fv:0, light });
  for (const o of balls) if (o.state === "ok") makeSmile(o, rnd(1.0, 1.6));   // みんなで 見送る
  stars(mu, mv, ["#FFE889", "#FFD86B", "#FF9FBB", "#ffffff"], light ? 6 : 12, 30, 0);
  if (!light){
    beep(1568, .09, "square", .10, 1.0);
    setTimeout(() => beep(1318, .09, "square", .09, 1.0), 60);
    setTimeout(() => beep(1046, .17, "triangle", .10, 1.0), 120);
    setTimeout(() => beep(1568, .20, "sine", .07, 1.0), 210);
  } else {
    beep(1046, .07, "triangle", .07);
    setTimeout(() => beep(1568, .09, "sine", .05), 60);
  }
  sends++;
  addScore("pop", 3);                                    // 見送り 1組＝3点（本体と おなじ）
  if (gameState === "play") growBack(SHRINK_BACK);       // 見送りで お盆が すこし ひろがる
  fx.push({ t:"txt", u:mu, v:mv, h: 70, s:"+3", life:.9, age:0, c:"#d9822b", size:20 });
  if (sends % SCENE_EVERY === 0) setTimeout(() => changeScene(), 2200);   // 走りおわってから
}
/* 2匹の いち（すすむ 向きに たいして よこに ならぶ） */
function runnerPos(g){
  const pu = -g.fv, pv = g.fu;   // すすむ 向きに 直角
  const o = RUN_SP/2;
  return [{ u:g.u + pu*o, v:g.v + pv*o, k:0 }, { u:g.u - pu*o, v:g.v - pv*o, k:1 }];
}
function stepRunners(dt){
  for (let i = runners.length-1; i >= 0; i--){
    const g = runners[i];
    g.age += dt; g.st += dt;
    const gt = gateOf(g.side);
    let tu, tv, spd;
    if (g.stage === 0){                         // ぽんっと 出て その場で はねる
      g.hy = floorY(g.u, g.v);
      if (g.st > .28){ g.stage = 1; g.st = 0; }
      continue;
    }
    if (g.stage === 1){ const p = gpt(gt, -30, 0); tu = p.u; tv = p.v; spd = 190; }             // 門へ
    else if (g.stage === 2){ const p = gpt(gt, RIM_W + 42, 0); tu = p.u; tv = p.v; spd = 170; } // 門を ぬける
    else { tu = g.side*(R + 1400); tv = g.v; spd = 250; }                                       // しきものを よこへ
    const du = tu - g.u, dv = tv - g.v, d = Math.hypot(du, dv);
    if (d > 1){
      const nu = du/d, nv = dv/d;
      g.fu += (nu - g.fu)*Math.min(1, dt*8); g.fv += (nv - g.fv)*Math.min(1, dt*8);
      const n = Math.hypot(g.fu, g.fv) || 1; g.fu /= n; g.fv /= n;
      const step = Math.min(d, spd*dt);
      g.u += nu*step; g.v += nv*step;
    }
    if (g.stage === 1 && d < 6){ g.stage = 2; g.st = 0; }
    else if (g.stage === 2 && d < 6){ g.stage = 3; g.st = 0; g.y0 = floorY(g.u, g.v); }
    if (g.stage === 3){
      // しきものへ ぴょんと おりる（下へ。上には いかない）
      const k = Math.min(1, g.st / .32);
      g.hy = g.y0*(1 - k) + GROUND_Y*k + Math.sin(k*Math.PI)*18;
      if (k >= 1) g.stage = 4;
      if (Math.random() < dt*20) dustW(g.u, g.hy, g.v, 3);
    } else if (g.stage === 4){
      g.hy = GROUND_Y;
      if (Math.random() < dt*14) dustW(g.u - g.side*14, GROUND_Y, g.v + rnd(-20, 20), 2);
      const p = proj(g.u - g.side*RUN_SP, GROUND_Y, g.v);
      if ((g.side > 0 && p.x > W + 80) || (g.side < 0 && p.x < -80)){
        runners.splice(i, 1);
        continue;
      }
    } else {
      g.hy = floorY(g.u, g.v);
      if (Math.random() < dt*12) dust(g.u - g.fu*16, g.v - g.fv*16, 10, 1);
    }
  }
  // 門の とびら：走る 子が 近いときだけ ひらく
  for (const gt of gates){
    let want = 0;
    const c = gpt(gt, RIM_W/2, 0);
    for (const g of runners) if (g.side === gt.side && g.stage >= 1 && g.stage <= 3 &&
                                 Math.hypot(g.u - c.u, g.v - c.v) < 120) want = 1;
    gt.open += ((want ? 1 : 0) - gt.open) * Math.min(1, dt*(want ? 9 : 3));
  }
}

/* ---------------- こまかい 演出 ---------------- */
function stars(u, v, cols, n, r, h0, pw){
  pw = pw || 1;
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283), sp = rnd(50, 170)*pw;
    fx.push({ t:"star", u:u + Math.cos(a)*r*.4, v:v + Math.sin(a)*r*.4, h: (h0 || 0) + r*.9,
              vu:Math.cos(a)*sp, vv:Math.sin(a)*sp, vh: rnd(40, 170)*Math.sqrt(pw),
              s: rnd(5.5, 9.5)*Math.sqrt(pw), rot: rnd(0, 6), c: pick(cols), life: rnd(.6, .95), age:0 });
  }
}
function dust(u, v, r, n){
  for (let i = 0; i < n; i++){
    const a = rnd(0, 6.283);
    fx.push({ t:"dust", u:u + Math.cos(a)*r*.8, v:v + Math.sin(a)*r*.8, wy:null, s:rnd(3, 6),
              vu:Math.cos(a)*rnd(20, 60), vv:Math.sin(a)*rnd(20, 60), life:rnd(.3, .5), age:0 });
  }
}
function dustW(u, y, v, n){   // しきものの 上の すなぼこり（世界の 高さを じかに もつ）
  for (let i = 0; i < n; i++)
    fx.push({ t:"dust", u:u + rnd(-8, 8), v:v + rnd(-6, 6), wy:y, s:rnd(3, 5.5),
              vu:rnd(-20, 20), vv:rnd(-10, 10), life:rnd(.3, .5), age:0 });
}
function stepFx(dt){
  for (let i = fx.length-1; i >= 0; i--){
    const f = fx[i];
    f.age += dt;
    if (f.age >= f.life){ fx.splice(i, 1); continue; }
    if (f.t === "chip"){
      f.vh -= 900*dt; f.u += f.vu*dt; f.v += f.vv*dt; f.h += f.vh*dt; f.rot += dt*6;
      if (f.h < 1){ f.h = 1; f.vh = -f.vh*.3; f.vu *= .5; f.vv *= .5; }
    } else if (f.t === "star"){
      f.vh -= 700*dt;
      f.u += f.vu*dt; f.v += f.vv*dt; f.h += f.vh*dt;
      if (f.h < 2){ f.h = 2; f.vh = -f.vh*.3; f.vu *= .6; f.vv *= .6; }   // 粒は 下へ おちて お盆に のる

let toastT = 0;
function toast(s){

/* ============================================================
   ふちの 切れ目（第3版）
   ------------------------------------------------------------
   おくがわの どこか 1か所。はばは GAP_HALF×2。それより 小さい子（いぬ・ねこ・ひよこ）は
   ここから 出て いって しまい、もう もどらない。出て いく 子は **びっくり顔**
   （作者の 注文）。落ちて 消えるのでは なく、すべり台を おりて しきものの 上を
   ころころ 遠くへ 転がって いく 絵に して ある。
   ============================================================ */
let outs = [];
function wallPush(b, w){
  if (w.dist >= b.r) return;
  const push = b.r - w.dist;
  b.u += w.nu*push; b.v += w.nv*push;
  const vout = -(b.vu*w.nu + b.vv*w.nv);
  if (vout > 0){ b.vu += (1 + E_RIM)*vout*w.nu; b.vv += (1 + E_RIM)*vout*w.nv; }
}
/* 切れ目の 口に いる 小さい子を あつかう。あつかったら true（ふつうの 壁は かけない） */
function gapPass(b){
  const du = b.u - gap.P.u, dv = b.v - gap.P.v;
  const along = du*gap.t.u + dv*gap.t.v, across = du*gap.n.u + dv*gap.n.v;
  if (across < -b.r - 2 || Math.abs(along) > GAP_HALF) return false;
  // 切れ目の 両はしの ふち（かどに ぶつかる）
  for (const sg of [-1, 1]){
    const c = clamp(across, 0, RIM_W);
    const eu = gap.P.u + gap.t.u*sg*GAP_HALF + gap.n.u*c, ev = gap.P.v + gap.t.v*sg*GAP_HALF + gap.n.v*c;
    const x = b.u - eu, y = b.v - ev, d = Math.hypot(x, y);
    if (d < b.r && d > .01){
      const nu = x/d, nv = y/d;
      b.u = eu + nu*b.r; b.v = ev + nv*b.r;
      const vin = -(b.vu*nu + b.vv*nv);
      if (vin > 0){ b.vu += (1 + E_RIM)*vin*nu; b.vv += (1 + E_RIM)*vin*nv; }
    }
  }
  if (across < 0) wallPush(b, wallInfo(b.u, b.v, true));
  if (across > b.r*.3) escape(b);
  return true;
}
function escape(b){
  b.state = "out";
  if (b.brick){                                    // レンガを 外へ おとせた（顔は ないので こえは 出さない）
    const vn0 = b.vu*gap.n.u + b.vv*gap.n.v, add0 = Math.max(0, 120 - vn0);
    outs.push({ brick:true, jama:b.jama, yaw:b.yaw, tier:-1, r:b.r, u:b.u, v:b.v, vu:b.vu + gap.n.u*add0, vv:b.vv + gap.n.v*add0,
                y: floorY(b.u, b.v) + b.h, vy:0, age:0, phase:0, roll:0, sq:0, sqv:0 });
    beep(300, .3, "triangle", .05, .5);
    return;
  }
  const vn = b.vu*gap.n.u + b.vv*gap.n.v;
  const add = Math.max(0, 150 - vn);
  outs.push({ tier:b.tier, r:b.r, u:b.u, v:b.v, vu:b.vu + gap.n.u*add, vv:b.vv + gap.n.v*add,
              y: floorY(b.u, b.v) + b.h, vy: Math.max(0, b.vh), age:0, phase:b.phase, roll:b.roll, sq:0, sqv:0 });
  fx.push({ t:"txt", u:b.u, v:b.v, h: b.r*2 + 20, s:"あっ！", life:1.0, age:0, c:"#7a6a9a", size:20 });
  for (const o of balls) if (o !== b && o.state === "ok" && Math.hypot(o.u - b.u, o.v - b.v) < 170) makeShock(o, rnd(.05, .2), .5, 1);
  beep(700, .45, "sine", .06, .45);      // ひゅ〜（下がる 音）
}
function stepOuts(dt){
  for (let i = outs.length - 1; i >= 0; i--){
    const o = outs[i];
    o.age += dt;
    o.u += o.vu*dt; o.v += o.vv*dt;
    const sp = Math.hypot(o.vu, o.vv);
    if (sp > 130){ o.vu *= 1 - .4*dt; o.vv *= 1 - .4*dt; }
    o.roll += (o.vu/o.r)*dt;
    if (o.brick) o.yaw += dt*1.5;
    const across = (o.u - gap.P.u)*gap.n.u + (o.v - gap.P.v)*gap.n.v;
    if (across < RIM_W + 2){ o.y = floorY(o.u, o.v); o.vy = 0; }
    else if (across < RIM_W + 60){                         // すべり台を おりる
      const k = (across - RIM_W - 2)/58;
      o.y = floorY(gap.P.u, gap.P.v)*(1 - k) + GROUND_Y*k;
    } else {
      o.vy -= GRAV*dt; o.y += o.vy*dt;
      if (o.y <= GROUND_Y){ if (o.vy < -150) o.sqv -= 2; o.y = GROUND_Y; o.vy = o.vy < -150 ? -o.vy*.3 : 0; }
    }
    o.sqv += (-o.sq*260 - o.sqv*14)*dt; o.sq = clamp(o.sq + o.sqv*dt, -.3, .3);
    if (o.age > 3.4) outs.splice(i, 1);
  }
}
function outAcross(o){ return (o.u - gap.P.u)*gap.n.u + (o.v - gap.P.v)*gap.n.v; }
function drawOut(o){
  const p = proj(o.u, o.y + o.r, o.v);
  const a = o.age > 2.6 ? Math.max(0, (3.4 - o.age)/.8) : 1;
  if (o.jama){ drawJamaAt(p.x, p.y, p.s, o, a); return; }
  if (o.brick){ drawBrickAt(p.x, p.y, p.s, o.yaw, a, 0); return; }
  const sp = proj(o.u, o.y, o.v);
  ctx.globalAlpha = .18*a; ctx.fillStyle = "#6a5040";
  ctx.beginPath(); ctx.ellipse(sp.x, sp.y, o.r*.9*sp.s, o.r*.9*sp.s*SINP, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = a;
  ctx.save(); ctx.translate(p.x, p.y); ctx.scale(p.s, p.s);
  const ph = o.phase + time*.6;
  // びっくり顔の まま（su＝1）
  drawCreature(ctx, o.tier, o.r, ph, 1, o.sq, 0, 1, 1, 0, 0, 0, ph - o.roll*TIERS[o.tier].fluff*.5);
  ctx.restore(); ctx.globalAlpha = 1;
}
/* 切れ目の そとがわ：しきい と すべり台（お盆の ゆかより 先に えがく） */
function drawGapOutside(){
  if (!GAP_ON) return;
  const n = 4;
  for (let k = 0; k < n; k++){
    const t0 = -GAP_HALF + 2*GAP_HALF*k/n, t1 = -GAP_HALF + 2*GAP_HALF*(k + 1)/n;
    const a = gpt(gap, -2, t0), b = gpt(gap, -2, t1), c = gpt(gap, RIM_W, t1), e = gpt(gap, RIM_W, t0);
    quad(trayP(a.u, 0, a.v), trayP(b.u, 0, b.v), trayP(c.u, 0, c.v), trayP(e.u, 0, e.v), k % 2 ? "#ffffff" : "#FFE27A");
    const f = gpt(gap, RIM_W + 60, t1), g = gpt(gap, RIM_W + 60, t0);
    quad(trayP(e.u, 0, e.v), trayP(c.u, 0, c.v), proj(f.u, GROUND_Y, f.v), proj(g.u, GROUND_Y, g.v), k % 2 ? "#ffffff" : "#FFE27A");
  }
  for (const o of outs) if (outAcross(o) > RIM_W + 2) drawOut(o);
}
/* 切れ目の 両はしの ふちの 切り口と、小さな はた（ここが あいて いるよ、の しるし） */
function drawGapCaps(){
  if (!GAP_ON) return;
  for (const sg of [-1, 1]){
    const i0 = gpt(gap, 0, sg*GAP_HALF), o0 = gpt(gap, RIM_W, sg*GAP_HALF);
    quad(trayP(i0.u, 0, i0.v), trayP(o0.u, -BASE_H, o0.v), trayP(o0.u, RIM_H, o0.v), trayP(i0.u, RIM_H, i0.v), C.rimOut);
    const m = gpt(gap, RIM_W/2, sg*(GAP_HALF + 4));
    const b = trayP(m.u, RIM_H, m.v), t = trayP(m.u, RIM_H + 34, m.v);
    ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1.5, 2.6*b.s); ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
    const f = trayP(m.u + gap.t.u*sg*16, RIM_H + 27, m.v + gap.t.v*sg*16);
    const t2 = trayP(m.u, RIM_H + 20, m.v);
    ctx.fillStyle = "#FF9F6B";
    ctx.beginPath(); ctx.moveTo(t.x, t.y); ctx.lineTo(f.x, f.y + Math.sin(time*5 + sg)*1.5); ctx.lineTo(t2.x, t2.y); ctx.closePath(); ctx.fill();
  }
}

/* ============================================================
   つむじかぜ（第3版）
   ------------------------------------------------------------
   ときどき お盆に あらわれて うろうろ する 小さな 風。動物では ない。
   ふれた 子は くるっと 回って **合体まえの 2人に もどる**（ひとつ 大きい子 2人）。
   いちばん 大きい子（らいおん）は もどる 先が ないので、くるっと 回るだけ。
   1回 いたずら したら ふっと 消える（何度も こわされると つらいので）。
   ============================================================ */
let ww = null, wwT = WW_EVERY*.7;
function spawnWW(u, v){
  if (u === undefined){
    for (let k = 0; k < 60; k++){
      const x = rnd(-R, R), y = rnd(-R, R);
      if (wallInfo(x, y).dist < 70) continue;
      let ok = true;
      for (const b of balls) if (Math.hypot(b.u - x, b.v - y) < b.r + WW_R + 30) ok = false;
      for (const o of OBS) if (Math.hypot(o.u - x, o.v - y) < o.r + WW_R + 20) ok = false;
      if (ok){ u = x; v = y; break; }
    }
    if (u === undefined) return false;
  }
  ww = { u, v, dir: rnd(0, 6.28), age:0, life: WW_LIFE, spin:0 };
  beep(260, .5, "sine", .035, 2.4); setTimeout(() => beep(340, .45, "sine", .03, 2.2), 120);
  return true;
}
function stepWW(dt){
  if (!ww){
    if (started && balls.length >= 4){ wwT -= dt; if (wwT <= 0){ if (spawnWW()) wwT = WW_EVERY; else wwT = 1; } }
    return;
  }
  const w0 = ww;
  w0.age += dt; w0.spin += dt*9;
  if (w0.age >= w0.life){ ww = null; return; }
  // うろうろ：向きを すこしずつ かえる。ふちと 柱は よける
  w0.dir += rnd(-2.2, 2.2)*dt;
  let du = Math.cos(w0.dir), dv = Math.sin(w0.dir);
  const w = wallInfo(w0.u, w0.v);
  if (w.dist < 80){ const k = (80 - w.dist)/80; du += w.nu*k*2; dv += w.nv*k*2; }
  for (const o of OBS){
    const x = w0.u - o.u, y = w0.v - o.v, d = Math.hypot(x, y);
    if (d < o.r + WW_R + 30){ du += x/d*1.5; dv += y/d*1.5; }
  }
  const l = Math.hypot(du, dv) || 1; du /= l; dv /= l;
  w0.dir = Math.atan2(dv, du);
  w0.u += du*WW_SPEED*dt; w0.v += dv*WW_SPEED*dt;
  const w2 = wallInfo(w0.u, w0.v);
  if (w2.dist < WW_R){ w0.u += w2.nu*(WW_R - w2.dist); w0.v += w2.nv*(WW_R - w2.dist); }
  if (w0.age > w0.life - .8) return;                  // 消えかけは もう さわらない
  for (const b of balls){
    if (b.state !== "ok" || b.h > 90 || b.brick) continue;
    const x = b.u - w0.u, y = b.v - w0.v, d = Math.hypot(x, y) || 1;
    // まわりを すこし まわす
    if (d < b.r + 80){ b.vu += (-y/d)*170*dt; b.vv += (x/d)*170*dt; }
    if (d < b.r + WW_R*.8 && !(b.wwCool > 0)){
      if (b.tier > 0){ splitBall(b, w0); w0.life = Math.min(w0.life, w0.age + .8); return; }
      b.spinT = .45; b.spinDir = 1; b.wwCool = 1.6; makeShock(b, 0, .5, 1);
      b.vu += x/d*160; b.vv += y/d*160;
      beep(420, .18, "triangle", .05, 1.4);
    }
  }
}
function splitBall(b, w0){
  const t = b.tier, pt = t - 1, rp = TIERS[pt].r;
  const ax = Math.atan2(b.v - w0.v, b.u - w0.u) + Math.PI/2;
  const cu = Math.cos(ax), cv0 = Math.sin(ax);
  balls = balls.filter(x => x !== b);
  const kids = [];
  for (const sg of [-1, 1]){
    const nb = newBall(pt, b.u + cu*sg*rp*1.02, b.v + cv0*sg*rp*1.02);
    nb.vu = b.vu*.3 + cu*sg*150; nb.vv = b.vv*.3 + cv0*sg*150;
    nb.h = b.h; nb.vh = 240; nb.pop = .35; nb.age = 1;
    nb.spinT = .45; nb.spinDir = sg; nb.noMerge = 1.6; nb.wwCool = 3;
    makeShock(nb, 0, .6, 1);
    balls.push(nb); kids.push(nb);
  }
  stars(b.u, b.v, ["#BFE6FF", "#ffffff", "#DCCBFF", TIERS[pt].body], 12, b.r, b.h);
  fx.push({ t:"ring", u:b.u, v:b.v, r0:b.r*.4, r1:rp*2.4, life:.45, age:0, c:"#9FC9EE" });
  fx.push({ t:"txt", u:b.u, v:b.v, h: rp*2 + 30, s:"もどっちゃった！", life:1.1, age:0, c:"#5c7fa8", size:17 });
  for (const o of balls) if (!kids.includes(o) && o.state === "ok" && Math.hypot(o.u - b.u, o.v - b.v) < 160) makeShock(o, rnd(.02, .12), .35, 1);
  // 合体（下がる 音）の 反対：上がる 音
  beep(300 + pt*95, .14, "sine", .1, 1.7);
  setTimeout(() => beep(420 + pt*95, .12, "sine", .07, 1.5), 90);
}
function drawWW(){
  if (!ww) return;
  const w0 = ww;
  const a = Math.min(1, w0.age/.6) * (w0.age > w0.life - .8 ? Math.max(0, (w0.life - w0.age)/.8) : 1);
  const base = trayP(w0.u, 0, w0.v);
  ctx.globalAlpha = .16*a; ctx.fillStyle = "#6a7a90";
  ctx.beginPath(); ctx.ellipse(base.x, base.y, WW_R*base.s, WW_R*base.s*SINP, 0, 0, 7); ctx.fill();
  ctx.lineCap = "round";
  for (let k = 0; k < 8; k++){
    const hk = 4 + k*12, rad = WW_R*(.42 + k*.16);
    const wob = Math.sin(w0.age*4 + k*.9)*4;
    const p = trayP(w0.u + wob, hk, w0.v);
    const rx = rad*p.s, ry = rx*SINP*.95;
    const st = w0.spin + k*.8;
    ctx.globalAlpha = .55*a; ctx.strokeStyle = "#6FA6D6"; ctx.lineWidth = Math.max(2.5, 5.6*p.s);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, st, st + 3.6); ctx.stroke();
    ctx.globalAlpha = .95*a; ctx.strokeStyle = "#ffffff"; ctx.lineWidth = Math.max(1.5, 3.2*p.s);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, ry, 0, st, st + 3.6); ctx.stroke();
    ctx.globalAlpha = .55*a; ctx.strokeStyle = "#A9D4F5"; ctx.lineWidth = Math.max(1, 2*p.s);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rx*.8, ry*.8, 0, st + 2.4, st + 4.6); ctx.stroke();
  }
  // くるくる まわる はっぱ
  for (let k = 0; k < 3; k++){
    const an = w0.spin*.8 + k*2.09, hk = 18 + k*18, rad = WW_R*(.7 + k*.25);
    const p = trayP(w0.u + Math.cos(an)*rad, hk, w0.v + Math.sin(an)*rad);
    ctx.globalAlpha = .9*a; ctx.fillStyle = k === 1 ? "#FFB8D2" : "#9BCB52";
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(an*2);
    ctx.beginPath(); ctx.ellipse(0, 0, 4.5*p.s, 2.4*p.s, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ---------------- じゃまな 柱（つみき）を えがく ---------------- */
function drawObstacle(o){
  const b = trayP(o.u, 0, o.v), t = trayP(o.u, OB_H, o.v);
  const rx = o.r*b.s, ry = rx*SINP, rxt = o.r*t.s, ryt = rxt*SINP;
  // 影
  ctx.globalAlpha = .2; ctx.fillStyle = "#6a5040";
  ctx.beginPath(); ctx.ellipse(b.x + 3*b.s, b.y + 2*b.s, rx*1.15, ry*1.15, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  // よこ
  ctx.beginPath();
  ctx.moveTo(t.x - rxt, t.y); ctx.lineTo(b.x - rx, b.y);
  ctx.ellipse(b.x, b.y, rx, ry, 0, Math.PI, 0, true);
  ctx.lineTo(t.x + rxt, t.y); ctx.closePath();
  const gr = ctx.createLinearGradient(b.x - rx, 0, b.x + rx, 0);
  gr.addColorStop(0, C.arch); gr.addColorStop(.45, mix(C.arch, "#ffffff", .35)); gr.addColorStop(1, C.archL);
  ctx.fillStyle = gr; ctx.fill();
  ctx.strokeStyle = C.archL; ctx.lineWidth = Math.max(1, 1.4*b.s); ctx.stroke();
  // しろい おび

  ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 5*m.s;
  ctx.beginPath(); ctx.ellipse(m.x, m.y, o.r*m.s*.99, o.r*m.s*SINP*.99, 0, 0, Math.PI); ctx.stroke();
  // うえ
  ctx.fillStyle = mix(C.arch, "#ffffff", .55);
  ctx.beginPath(); ctx.ellipse(t.x, t.y, rxt, ryt, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = C.archL; ctx.lineWidth = Math.max(1, 1.4*t.s); ctx.stroke();
  ctx.fillStyle = C.arch;

}

/* ---------------- 入力：傾ける ---------------- */
const keys = {};
let drag = null;
let sensor = { on:false, has:false, x:0, y:0, x0:0, y0:null, rx:null, ry:null };
/* 前後の 基準（作者の 注文11）。手で 持った 角度を「お盆が 水平」と みなす。左右は いつも 0度。
   "auto"＝はじめる／まっすぐ を おした ときの 前後の 角度。30・45・0 は 決めうち。 */
let baseMode = "auto";
try { const m = localStorage.getItem("mamemaru3d-base"); if (["auto","0","30","45"].includes(m)) baseMode = m; } catch(e){}
function applyBase(){
  sensor.x0 = 0;
  if (baseMode === "auto"){ if (sensor.has) sensor.y0 = sensor.y; else sensor.y0 = null; }
  else sensor.y0 = +baseMode;
}
const SENS_DEG = 14;     // スマホを 何度 傾けたら 上限か（第5版 20 → 14：少し 傾けるだけで よく 転がる）
const SENS_EASE = 0.028; // センサーの ときの 傾きの 追いつき（第5版：0.085 → 0.028）

addEventListener("keydown", e => {
  const k = e.key;
  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","a","d","w","s"].includes(k)){ keys[k] = true; e.preventDefault(); }
});
addEventListener("keyup", e => { keys[e.key] = false; });
cv.addEventListener("pointerdown", e => {
  drag = { x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, id:e.pointerId };
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
});
cv.addEventListener("pointermove", e => { if (drag && e.pointerId === drag.id){ drag.x = e.clientX; drag.y = e.clientY; } });
function endDrag(e){ if (drag && e.pointerId === drag.id) drag = null; }
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);

function screenAngle(){
  if (screen.orientation && typeof screen.orientation.angle === "number") return screen.orientation.angle;
  return typeof window.orientation === "number" ? window.orientation : 0;
}
function onOrient(e){
  if (e.beta == null || e.gamma == null) return;
  const a = ((screenAngle() % 360) + 360) % 360;
  let x, y;
  if (a === 90){ x = e.beta; y = -e.gamma; }
  else if (a === 270){ x = -e.beta; y = e.gamma; }
  else if (a === 180){ x = -e.gamma; y = -e.beta; }
  else { x = e.gamma; y = e.beta; }
  // 手の ふるえで ぷるぷる しない ように、すこし なめらかに
  if (sensor.rx === null){ sensor.rx = x; sensor.ry = y; }
  sensor.rx += (x - sensor.rx)*.6; sensor.ry += (y - sensor.ry)*.6;     // 第5版：.25 → .6（おくれを へらす）
  sensor.x = sensor.rx; sensor.y = sensor.ry; sensor.has = true;
  if (sensor.y0 === null) applyBase();   // さいしょの 持ちかたを「まっすぐ」に（前後だけ）
}
function level(){ baseMode = "auto"; saveBase(); applyBase(); }   // いまの 前後の 角度を 水平に
function saveBase(){ try { localStorage.setItem("mamemaru3d-base", baseMode); } catch(e){} paintBase(); }
async function enableSensor(){
  try {
    if (typeof DeviceOrientationEvent !== "undefined" &&
        typeof DeviceOrientationEvent.requestPermission === "function"){
      const r = await DeviceOrientationEvent.requestPermission();   // iPhone は 1回 きく
      if (r !== "granted") return;
    }
    if (!sensor.on) addEventListener("deviceorientation", onOrient);
    sensor.on = true;
  } catch(e){}
}

let testTilt = null;   // 確かめ用
function readInput(){
  if (testTilt){ tiltT.u = testTilt.u; tiltT.v = testTilt.v; return; }
  let u = 0, v = 0;
  if (drag){
    const m = Math.min(W, H) * .28;
    u = (drag.x - drag.x0) / m; v = (drag.y - drag.y0) / m;
  } else if (keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown || keys.a || keys.d || keys.w || keys.s){
    u = ((keys.ArrowRight || keys.d) ? 1 : 0) - ((keys.ArrowLeft || keys.a) ? 1 : 0);
    v = ((keys.ArrowDown || keys.s) ? 1 : 0) - ((keys.ArrowUp || keys.w) ? 1 : 0);
  } else if (sensor.on && sensor.has){
    u = (sensor.x - sensor.x0) / SENS_DEG;
    v = (sensor.y - sensor.y0) / SENS_DEG;
    const m = Math.hypot(u, v), dz = .04;      // まっすぐ の まわりは すこし あそび（第5版 .08 → .04）
    if (m < dz){ u = 0; v = 0; } else { const k = (m - dz)/(1 - dz)/m; u *= k; v *= k; }
  }
  const m = Math.hypot(u, v);
  if (m > 1){ u /= m; v /= m; }
  tiltT.u = u * MAX_TILT; tiltT.v = v * MAX_TILT;
  levelBtn.style.display = (sensor.on && sensor.has) ? "" : "none";
}

/* ---------------- 更新 ---------------- */
let started = false, flashSoft = false;
function update(dt){
  time += dt;
  readInput();
  tiltPrev.u = tilt.u; tiltPrev.v = tilt.v;
  const useSensor = !drag && !testTilt && sensor.on && sensor.has &&
                    !(keys.ArrowLeft || keys.ArrowRight || keys.ArrowUp || keys.ArrowDown || keys.a || keys.d || keys.w || keys.s);
  const k = 1 - Math.exp(-dt / (useSensor ? SENS_EASE : TILT_EASE));
  tilt.u += (tiltT.u - tilt.u)*k; tilt.v += (tiltT.v - tilt.v)*k;
  if (thudCool > 0) thudCool -= dt;
  if (boingCool > 0) boingCool -= dt;

  if (started && !fever){
    spawnT -= dt;
    if (spawnT <= 0){
      const ok = (Math.random() < jamaRate()) ? queueJama() : queueSpawn();   // ときどき 黒い玉（第10版）
      spawnT = ok ? spawnEvery() : .5;     // 第8版：何人 いても ふってくる（上限なし）
    }
  }
  if (dt > 0) flick(dt);
  magnet(dt);
  stepPending(dt);
  physics(dt);
  stepMerges(dt);
  stepRunners(dt);
  stepOuts(dt);
  stepWW(dt);
  stepFx(dt);
  if (chainLive && time - chainLive.t > CHAIN_WINDOW + .35){
    if (chainLive.n >= 3) chainFinale(chainLive);
    chainLive = null;
  }
  stepGame(dt);
  if (sceneSwap){
    sceneSwap.t += dt;
    if (sceneSwap.t >= .2 && !sceneSwap.done){ sceneSwap.done = true; doSwap(); }
    if (sceneSwap.t >= .6) sceneSwap = null;
  }
  if (flashT > 0){ flashT -= dt; if (flashT <= 0) flashSoft = false; }
  if (toastT > 0){ toastT -= dt; if (toastT <= 0) document.getElementById("toast").classList.remove("on"); }
  for (const b of balls){
    b.age += dt;
    if (b.hitCool > 0) b.hitCool -= dt;
    b.sqv += (-b.sq*260 - b.sqv*14) * dt;      // ぷにっと（ばね）
    b.sq += b.sqv * dt;
    b.sq = clamp(b.sq, -.3, .3);
    if (b.pop < 1) b.pop = Math.min(1, b.pop + dt/.34);
    b.lean += (clamp(b.vu/500, -1, 1)*.14 - b.lean) * Math.min(1, dt*8);   // すすむ 向きに かたむく
    if (b.spinT > 0) b.spinT -= dt;
    if (rollable(b)) stepRoll(b, dt);
    if (b.brick) b.yaw += (b.vu*.0016 - b.vv*.0008)*dt*6;
    if (b.noMerge > 0) b.noMerge -= dt;
    if (b.wwCool > 0) b.wwCool -= dt;
    stepFace(b, dt);
  }
}

/* ---------------- えがく ---------------- */
function quad(p1, p2, p3, p4, fill){
  ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
}
/* ふち。おくがわ（内かべが こちらを 向く ところ）は 子より 先に えがく。
   てまえがわ（上＋外かべ）は 1こまずつ 子と いっしょに 奥から ならべる（rimItems）。 */
function segBack(i){ const n0 = NRM[i], n1 = NRM[(i + 1) % N_SEG]; return (n0.v + n1.v) < 0; }
function rimSeg(i, part){
  const j = (i + 1) % N_SEG;
  const I0 = IN[i], I1 = IN[j], O0 = OUT[i], O1 = OUT[j];
  const iT0 = trayP(I0.u, RIM_H, I0.v), iT1 = trayP(I1.u, RIM_H, I1.v);
  const oT0 = trayP(O0.u, RIM_H, O0.v), oT1 = trayP(O1.u, RIM_H, O1.v);
  ctx.lineCap = "round"; ctx.strokeStyle = C.line; ctx.lineWidth = Math.max(1, iT0.s*1.6);
  if (part === "back"){
    const iB0 = trayP(I0.u, 0, I0.v), iB1 = trayP(I1.u, 0, I1.v);
    quad(iB0, iB1, iT1, iT0, C.rimIn);
    quad(iT0, iT1, oT1, oT0, C.rimTop);
  } else {
    const oB0 = trayP(O0.u, -BASE_H, O0.v), oB1 = trayP(O1.u, -BASE_H, O1.v);
    quad(oT0, oT1, oB1, oB0, C.rimOut);
    quad(iT0, iT1, oT1, oT0, C.rimTop);
    ctx.beginPath(); ctx.moveTo(oB0.x, oB0.y); ctx.lineTo(oB1.x, oB1.y); ctx.stroke();
  }
  ctx.beginPath(); ctx.moveTo(iT0.x, iT0.y); ctx.lineTo(iT1.x, iT1.y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(oT0.x, oT0.y); ctx.lineTo(oT1.x, oT1.y); ctx.stroke();
}
function drawRimBack(){
  ctx.lineJoin = "round";
  for (let i = 0; i < N_SEG; i++) if (segBack(i) && !SEG_OPEN[i]) rimSeg(i, "back");
  drawGapCaps();
}
function rimItems(items){
  for (let i = 0; i < N_SEG; i++){
    if (segBack(i) || SEG_OPEN[i]) continue;
    const j = (i + 1) % N_SEG;
    const mu = (IN[i].u + OUT[j].u)/2, mv = (IN[i].v + OUT[j].v)/2;
    items.push({ d: trayP(mu, RIM_H, mv).d, draw: () => rimSeg(i, "front") });
  }
}
function drawFloor(){
  // しきものに おちる お盆の 影
  ctx.fillStyle = C.shadow;
  ctx.beginPath();
  for (let i = 0; i <= N_SEG; i += 2){
    const o = OUT[i % N_SEG];
    const p = proj(o.u*1.03 + tilt.u*40, GROUND_Y, o.v*1.03 + 10);
    if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
  }
  ctx.closePath(); ctx.fill();
  drawGapOutside();
  // ゆか
  ctx.beginPath();
  for (let i = 0; i <= N_SEG; i++){
    const q = IN[i % N_SEG], p = trayP(q.u, 0, q.v);
    if (i) ctx.lineTo(p.x, p.y); else ctx.moveTo(p.x, p.y);
  }
  ctx.closePath();
  const cc = trayP(0, 0, 0);
  const gr = ctx.createRadialGradient(cc.x, cc.y, 0, cc.x, cc.y, R*1.15*cc.s);
  gr.addColorStop(0, C.floor); gr.addColorStop(.75, C.floor); gr.addColorStop(1, C.floorEdge);
  ctx.fillStyle = gr; ctx.fill();
  ctx.fillStyle = C.dot;
  for (const d of DOTS){
    const p = trayP(d.u, 0, d.v);
    ctx.beginPath(); ctx.ellipse(p.x, p.y, d.s*p.s, d.s*p.s*SINP, 0, 0, 7); ctx.fill();
  }
}
/* 門の すきま：ふちの かわりに 板（しきい）が つづく */
function gateSillItems(items){
  for (const gt of gates){
    const c = gpt(gt, RIM_W, 0);
    items.push({ d: trayP(c.u, 0, c.v).d + 2, draw: () => {
      const n = 6;
      for (let k = 0; k < n; k++){
        const t0 = -GATE_HALF + 2*GATE_HALF*k/n, t1 = -GATE_HALF + 2*GATE_HALF*(k+1)/n;
        const a = gpt(gt, -2, t0), b = gpt(gt, -2, t1), c2 = gpt(gt, RIM_W, t1), e = gpt(gt, RIM_W, t0);
        quad(trayP(a.u, 0, a.v), trayP(b.u, 0, b.v), trayP(c2.u, 0, c2.v), trayP(e.u, 0, e.v), C.floorEdge);
        quad(trayP(e.u, 0, e.v), trayP(c2.u, 0, c2.v), trayP(c2.u, -BASE_H, c2.v), trayP(e.u, -BASE_H, e.v), C.rimOut);
      }
    }});
  }
}
/* 門（はしら＋とびら 2まい、アーチ）。子と 奥ゆきで ならべる */
function gateItems(items){
  gateSillItems(items);
  for (const gt of gates){
    for (const sv of [-1, 1]){
      const p = gpt(gt, RIM_W/2, sv*GATE_HALF);
      items.push({ d: trayP(p.u, RIM_H, p.v).d - 3, draw: () => drawPost(gt, sv) });
    }
    const c = gpt(gt, RIM_W/2, 0);
    items.push({ d: trayP(c.u, GATE_H, c.v).d - 4, draw: () => drawArch(gt) });
  }
}
function drawPost(gt, sv){
  const h = gpt(gt, RIM_W/2, sv*GATE_HALF);
  const b = trayP(h.u, -BASE_H, h.v), t = trayP(h.u, GATE_H*.78, h.v);
  ctx.lineCap = "round";
  ctx.strokeStyle = C.archL; ctx.lineWidth = 10*b.s + 2;
  ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
  ctx.strokeStyle = C.arch; ctx.lineWidth = 10*b.s;
  ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(t.x, t.y); ctx.stroke();
  // とびら（はしらを じくに、外へ ひらく）
  const ang = gt.open * 1.35;
  const len = GATE_HALF - 4;
  const e = { u: h.u + (-sv*gt.t.u*Math.cos(ang) + gt.n.u*Math.sin(ang))*len,
              v: h.v + (-sv*gt.t.v*Math.cos(ang) + gt.n.v*Math.sin(ang))*len };
  const p1 = trayP(h.u, 1, h.v), p2 = trayP(e.u, 1, e.v), p3 = trayP(e.u, RIM_H + 7, e.v), p4 = trayP(h.u, RIM_H + 7, h.v);
  ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath();
  ctx.fillStyle = C.door; ctx.fill();
  ctx.strokeStyle = C.doorL; ctx.lineWidth = Math.max(1, 1.6*b.s); ctx.lineJoin = "round"; ctx.stroke();
  const hc = trayP(h.u + (e.u - h.u)*.55, (RIM_H + 7)*.5, h.v + (e.v - h.v)*.55);
  ctx.fillStyle = C.heart;
  drawHeart(ctx, hc.x, hc.y, 6*hc.s);
}
function drawArch(gt){
  const pts = [];
  for (let i = 0; i <= 20; i++){
    const a = Math.PI*(1 - i/20);
    const q = gpt(gt, RIM_W/2, Math.cos(a)*GATE_HALF);
    pts.push(trayP(q.u, GATE_H*.78 + Math.sin(a)*GATE_H*.30, q.v));
  }
  const s = pts[10].s;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const [c, w] of [[C.archL, 10*s + 2], [C.arch, 10*s]]){
    ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
  }
  for (let i = 2; i <= 18; i += 4){
    const p = pts[i];
    ctx.fillStyle = i % 8 === 2 ? "#ffffff" : "#fff3a8";
    for (let k = 0; k < 5; k++){
      const a = k/5*6.283;
      ctx.beginPath(); ctx.arc(p.x + Math.cos(a)*3.2*s, p.y + Math.sin(a)*3.2*s, 2.6*s, 0, 7); ctx.fill();
    }
    ctx.fillStyle = "#ffcf5a"; ctx.beginPath(); ctx.arc(p.x, p.y, 2*s, 0, 7); ctx.fill();
  }
}

function drawBallShadow(b){
  const p = trayP(b.u, 0, b.v);
  const k = 1 / (1 + b.h/260);                   // 高く とぶほど 影は 小さく うすく
  const ps = b.pop < 1 ? popScale(b.pop) : 1;
  ctx.globalAlpha = .22 * k;
  ctx.fillStyle = "#6a5040";
  const rx = b.r*.92*p.s*k*ps;
  ctx.beginPath(); ctx.ellipse(p.x, p.y, rx, rx*SINP, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}
function popScale(t){            // ぽんっ：0.55 → 1.12 → 1
  const c1 = 1.9, c3 = c1 + 1, x = t - 1;
  return .55 + .45*(1 + c3*x*x*x + c1*x*x);
}
function drawOverMark(b, p){
  const left = OVER_SEC - (b.overT - OVER_WAIT);
  const rr = b.r*p.s + 6;
  ctx.save();
  ctx.globalAlpha = .55 + .35*Math.sin(time*12);
  ctx.strokeStyle = "#ff5f83"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.stroke();
  ctx.globalAlpha = 1;
  const n = String(Math.max(1, Math.ceil(left)));
  const fz = Math.round(22 + 8*(1 - (left % 1)));
  ctx.font = `bold ${fz}px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif`;
  ctx.textAlign = "center"; ctx.lineJoin = "round";
  ctx.lineWidth = 6; ctx.strokeStyle = "#ffffff"; ctx.strokeText(n, p.x, p.y - rr - 8);
  ctx.fillStyle = "#e0405f"; ctx.fillText(n, p.x, p.y - rr - 8);
  ctx.restore();
}
function drawBall(b){
  const p = trayP(b.u, b.h + b.r, b.v);
  if (b.overT > OVER_WAIT && gameState === "play") b._om = p;
  else b._om = null;
  if (b.jama){ drawJamaAt(p.x, p.y, p.s*(b.pop < 1 ? popScale(b.pop) : 1), b, 1); return; }
  if (b.brick){ drawBrickAt(p.x, p.y, p.s, b.yaw, 1, b.sq, BRICK_HP - b.hp); return; }
  let sc = p.s;
  if (b.pop < 1) sc *= popScale(b.pop);
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(sc, sc);
  if (b.sparkle){                      // にじいろの わ と まわる ほし（本体と おなじ 絵）
    const rr = b.r + 7;
    ctx.globalAlpha = .35 + .25*Math.sin(time*6); ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(0, 0, rr + 5, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    ctx.lineWidth = 4.5; ctx.lineCap = "round";
    for (let i = 0; i < RAINBOW.length; i++){
      const a0 = time*2.2 + i*(Math.PI*2/RAINBOW.length);
      ctx.strokeStyle = RAINBOW[i];
      ctx.beginPath(); ctx.arc(0, 0, rr, a0, a0 + Math.PI*2/RAINBOW.length*.82); ctx.stroke();
    }
    for (let i = 0; i < 4; i++){
      const a0 = -time*3.1 + i*Math.PI/2;
      ctx.fillStyle = RAINBOW[(i*2) % RAINBOW.length];
      starG(ctx, Math.cos(a0)*(rr + 8), Math.sin(a0)*(rr + 8), b.r*.22 + 2);
    }
  }
  const phase = b.phase + time*.6;
  if (rollable(b) && !(b.spinT > 0)){ drawRollingLion(b, phase); ctx.restore(); return; }
  ctx.rotate(b.lean + (b.spinT > 0 ? (1 - b.spinT/.45)*6.2832*(b.spinDir || 1) : 0));
  // とんで いる あいだは たてに すこし のびる（ふわっ）
  const air = b.h > 1 ? clamp(b.vh/900, -.08, .1) : 0;
  drawCreature(ctx, b.tier, b.r, phase, blinkAmt(b), b.sq + air, smileAmt(b), surpAmt(b), b.surpKind,
               0, 0, 0, phase - b.roll*TIERS[b.tier].fluff*.5);
  ctx.restore();
}
/* ============================================================
   試作：らいおんが 球として 転がる（方法3・第10版の 試作）
   ------------------------------------------------------------
   ・速く 転がって いる あいだは、顔が 球の 表面に そって ぐるっと まわる
     （横へ 転がれば 顔ごと くるっと、手前・奥へ 転がれば 顔が 上下に 流れて 裏へ かくれる）。
   ・ゆっくりに なると、起き上がりこぼしの ように「よいしょ」と 正面に もどる。
     止まって いる ときは いままで どおり 顔が 見える（表情が 読める）。
   ・絵は 本体の drawCreature を 2まいに わけて つかう：
       たてがみ（体・もこもこ輪郭）… 光の 向きは 動かさない。でこぼこだけ 回る
       顔（かおの 円・耳・目・口・ほっぺ）… 体の 色を 透明に して えがいた ものを、球に 貼った シールの ように 動かす
   ・らいおんは 後ろ姿も たてがみ なので、試作に ちょうど いい（ほかの子は 後ろ姿を 描く ひつようが ある）。
   ============================================================ */
let ROLL3D = ROLL3D_DEFAULT;          // 🔄 ボタンで 切りかえ（くらべる ため）
const ROLL_FAST = 110;                // これより 速いと 完全に 転がる
const ROLL_SLOW = 45;                 // これより おそいと 正面へ もどる 力が いちばん 強い
const RIGHT_RATE = 5.5;               // 正面へ もどる はやさ
// 四元数（w, x, y, z）
function qmul(a, b){
  return [a[0]*b[0] - a[1]*b[1] - a[2]*b[2] - a[3]*b[3],
          a[0]*b[1] + a[1]*b[0] + a[2]*b[3] - a[3]*b[2],
          a[0]*b[2] - a[1]*b[3] + a[2]*b[0] + a[3]*b[1],
          a[0]*b[3] + a[1]*b[2] - a[2]*b[1] + a[3]*b[0]];
}
function qaxis(x, y, z, ang){ const s = Math.sin(ang/2), l = Math.hypot(x, y, z) || 1; return [Math.cos(ang/2), x/l*s, y/l*s, z/l*s]; }
function qnorm(q){ const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0]/l, q[1]/l, q[2]/l, q[3]/l]; }
function qslerp(a, b, t){
  let d = a[0]*b[0] + a[1]*b[1] + a[2]*b[2] + a[3]*b[3];
  if (d < 0){ b = b.map(x => -x); d = -d; }
  if (d > .9995) return qnorm(a.map((x, i) => x + (b[i] - x)*t));
  const th = Math.acos(d), s = Math.sin(th);
  const ka = Math.sin((1 - t)*th)/s, kb = Math.sin(t*th)/s;
  return a.map((x, i) => x*ka + b[i]*kb);
}
function qrot(q, v){           // v を q で まわす
  const [w, x, y, z] = q, [vx, vy, vz] = v;
  const tx = 2*(y*vz - z*vy), ty = 2*(z*vx - x*vz), tz = 2*(x*vy - y*vx);
  return [vx + w*tx + (y*tz - z*ty), vy + w*ty + (z*tx - x*tz), vz + w*tz + (x*ty - y*tx)];
}
// 正面の 向き：顔（ローカル z）が カメラの ほう、顔の 上（ローカル y）が 画面の 上
const Q_FRONT = qaxis(1, 0, 0, -PHI);
const UPC = [0, COSP, -SINP], TOC = [0, SINP, COSP];
function scrX(w){ return w[0]; }
function scrY(w){ return -(w[0]*UPC[0] + w[1]*UPC[1] + w[2]*UPC[2]); }
function toCam(w){ return w[0]*TOC[0] + w[1]*TOC[1] + w[2]*TOC[2]; }
function rollable(b){ return ROLL3D && TIERS[b.tier] && TIERS[b.tier].face === "lion"; }

function stepRoll(b, dt){
  if (!b.q){ b.q = Q_FRONT.slice(); b.spin = 0; }
  const sp = Math.hypot(b.vu, b.vv);
  if (sp > 1){
    // すべらずに 転がる：まわる 軸は 上むき × すすむ 向き、角度は きょり ÷ 半径
    const ang = sp/b.r*dt;
    b.q = qnorm(qmul(qaxis(b.vv, 0, -b.vu, ang), b.q));
    b.spin += (-b.vu*COSP)/b.r*dt;          // 画面の 中で まわる ぶん（たてがみの でこぼこ）
  }
  // 方法3：おそく なったら 正面へ（起き上がりこぼし）
  const k = clamp((ROLL_FAST - sp)/(ROLL_FAST - ROLL_SLOW), 0, 1);
  if (k > 0 && b.h <= 1) b.q = qslerp(b.q, Q_FRONT, 1 - Math.exp(-RIGHT_RATE*k*k*dt));
}

const faceTex = document.createElement("canvas");
const faceCtx = faceTex.getContext("2d");
const TEX = 256, TEXU = 1.12;     // 顔の 絵は [-1.12, 1.12]×r の はんい を 256px に
faceTex.width = TEX; faceTex.height = TEX;
function drawMane(g, T, r, spinPhase){
  const grd = g.createRadialGradient(-r*.3, -r*.35, r*.1, 0, 0, r*1.05);
  grd.addColorStop(0, T.hi || "#ffffff"); grd.addColorStop(.35, T.body); grd.addColorStop(1, T.shade);
  g.fillStyle = grd; g.strokeStyle = T.line; g.lineWidth = Math.max(1, r*0.05);
  fluffPath(g, r, T.fluff, T.amp, spinPhase);
  g.fill(); g.stroke();
}
/* ballの ばしょで（translate・scale ずみ）、転がる らいおんを えがく */
function drawRollingLion(b, phase){
  const T = TIERS[b.tier], r = b.r;
  // ① たてがみ（光は 左上の まま。でこぼこだけ 回す）
  const air = b.h > 1 ? clamp(b.vh/900, -.08, .1) : 0;
  const sy = 1 + b.sq + air, sx = (1 - (b.sq + air)*.75);
  ctx.save(); ctx.scale(sx, sy);
  drawMane(ctx, T, r, phase + b.spin*T.fluff);     // phase が ふえると 左まわり（spin も 左まわりが プラス）
  ctx.restore();
  // ② 顔：体を 透明に した らいおんを 絵に して、球の 表面に 貼る
  const f = qrot(b.q, [0, 0, 1]), er = qrot(b.q, [1, 0, 0]), eu = qrot(b.q, [0, 1, 0]);
  const fz = toCam(f);
  const vis = clamp((fz + .05)/.35, 0, 1);            // 裏へ まわると うすく なって 消える
  if (vis <= 0) return;
  const clear = "rgba(0,0,0,0)";
  const TF = Object.assign({}, T, { body:clear, shade:clear, line:clear, hi:clear });
  faceCtx.setTransform(1, 0, 0, 1, 0, 0);
  faceCtx.clearRect(0, 0, TEX, TEX);
  // 半径 1 で えがくと 線の 太さの 下限（1px）が 大きすぎる ので、ピクセルの 大きさで えがく
  faceCtx.setTransform(1, 0, 0, 1, TEX/2, TEX/2);
  const bk = TIERS[b.tier]; TIERS[b.tier] = TF;
  try { drawCreature(faceCtx, b.tier, TEX/(2*TEXU), phase, blinkAmt(b), 0, smileAmt(b), surpAmt(b), b.surpKind); }
  finally { TIERS[b.tier] = bk; }
  ctx.save();
  // 球の 輪郭の 内がわだけ（ふちの たてがみに かくれる）
  ctx.beginPath(); ctx.arc(0, 0, r*(1 - T.amp*1.2), 0, 7); ctx.clip();
  ctx.globalAlpha = vis;
  // 顔の 平面（接平面）を 画面へ：x→er、y（下むき）→ -eu、中心は f
  ctx.transform(r*scrX(er), r*scrY(er), -r*scrX(eu), -r*scrY(eu), r*scrX(f), r*scrY(f));
  ctx.drawImage(faceTex, -TEXU, -TEXU, 2*TEXU, 2*TEXU);
  ctx.restore();
}

function runnerY(g, q){ return (g.stage <= 2) ? floorY(q.u, q.v) : g.hy; }
function drawRunnerGroup(g){
  const R0 = TIERS[LAST].r;
  const pop = Math.min(1, g.age/.16);
  const sc0 = RUN_SCALE * (.55 + .45*pop);
  const Q = runnerPos(g);
  // 光の 輪は ぜんぶ 先に（本体 設計判断3：うしろの 子の 光が 前の 子を 白く ぬらない）
  for (const q of Q){
    const hop = Math.abs(Math.sin(g.age*14 + g.ph + q.k*1.3)) * 11;
    const p = proj(q.u, runnerY(g, q) + R0*sc0 + hop, q.v);
    const rr = R0*sc0*p.s*1.7;
    const gr = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
    gr.addColorStop(0, "rgba(255,250,220,.75)"); gr.addColorStop(1, "rgba(255,250,220,0)");
    ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, 7); ctx.fill();
  }
  Q.sort((a, b) => proj(a.u, 0, a.v).d < proj(b.u, 0, b.v).d ? 1 : -1);
  for (const q of Q){
    const hop = Math.abs(Math.sin(g.age*14 + g.ph + q.k*1.3)) * 11;
    const y = runnerY(g, q);
    const sp = proj(q.u, y, q.v);
    ctx.globalAlpha = .18; ctx.fillStyle = "#6a5040";
    ctx.beginPath(); ctx.ellipse(sp.x, sp.y, R0*sc0*.7*sp.s, R0*sc0*.7*sp.s*SINP, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    const p = proj(q.u, y + R0*sc0 + hop, q.v);
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.scale(sc0*p.s, sc0*p.s);
    const dir = Math.abs(g.fu) > .3 ? Math.sign(g.fu) : 0;
    ctx.rotate(dir * (.14 + Math.sin(g.age*14 + g.ph + q.k*1.3)*.12));
    drawCreature(ctx, LAST, R0, g.age*3 + g.ph + q.k, 1, 0, 1, 0, 1);
    ctx.restore();
  }
}
function drawFx(f, pass){
  const k = f.age / f.life;
  if (f.t === "ring" && pass === 0){
    const p = trayP(f.u, 0, f.v);
    const rr = (f.r0 + (f.r1 - f.r0)*(1 - Math.pow(1-k, 2))) * p.s;
    ctx.globalAlpha = (1 - k)*.7;
    ctx.strokeStyle = f.c; ctx.lineWidth = 4*p.s*(1-k) + 1;
    ctx.beginPath(); ctx.ellipse(p.x, p.y, rr, rr*SINP, 0, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  } else if (f.t === "dust" && pass === 0){
    const p = f.wy === null ? trayP(f.u, 2, f.v) : proj(f.u, f.wy + 2, f.v);
    ctx.globalAlpha = (1 - k)*.5;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(p.x, p.y, f.s*p.s*(.6 + k*.8), 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
  } else if (f.t === "van" && pass === 1){
    // 全消し：ぴょんと はねて、小さく なって きえる
    const b = f.b, hop = Math.sin(Math.min(1, k*1.6)*Math.PI)*22;
    const p = trayP(b.u, f.h0 + hop + b.r, b.v);
    const sc = p.s * Math.max(0, 1 - k*k);
    if (sc > 0 && b.jama){ drawJamaAt(p.x, p.y, sc, b, 1 - k*.5); }
    else if (sc > 0 && b.brick){ drawBrickAt(p.x, p.y, sc, b.yaw, 1 - k*.5, 0); }
    else if (sc > 0){
      ctx.save(); ctx.globalAlpha = 1 - k*.5; ctx.translate(p.x, p.y); ctx.scale(sc, sc);
      drawCreature(ctx, b.tier, b.r, b.phase + time*.6, 1, 0, 1, 0, 1);
      ctx.restore(); ctx.globalAlpha = 1;
    }
  } else if (f.t === "chip" && pass === 1){
    const p = trayP(f.u, f.h, f.v);
    ctx.globalAlpha = k > .6 ? (1 - k)/.4 : 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(f.rot);
    ctx.fillStyle = f.c; const z = f.s*p.s;
    if (f.round){ ctx.beginPath(); ctx.arc(0, 0, z/2, 0, 7); ctx.fill(); } else ctx.fillRect(-z/2, -z/2, z, z*.7);
    ctx.restore(); ctx.globalAlpha = 1;
  } else if (f.t === "star" && pass === 1){
    const p = trayP(f.u, f.h, f.v);
    ctx.globalAlpha = k > .7 ? (1-k)/.3 : 1;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(f.rot);
    ctx.fillStyle = f.c;
    starG(ctx, 0, 0, f.s*p.s);
    ctx.restore(); ctx.globalAlpha = 1;
  } else if (f.t === "txt" && pass === 2){
    const p = trayP(f.u, f.h + k*30, f.v);
    const pop = Math.min(1, f.age/.15);
    ctx.globalAlpha = k > .7 ? (1-k)/.3 : 1;
    ctx.font = `bold ${Math.round(((f.size || 20)*p.s + 4)*(.7 + .3*pop))}px "Hiragino Maru Gothic ProN","Yu Gothic",sans-serif`;
    ctx.textAlign = "center"; ctx.lineJoin = "round";
    const hw = ctx.measureText(f.s).width/2 + 8;
    const x = clamp(p.x, hw, W - hw);                  // 画面の はしで 切れない ように
    ctx.lineWidth = 5; ctx.strokeStyle = "rgba(255,255,255,.95)"; ctx.strokeText(f.s, x, p.y);
    ctx.fillStyle = f.c || "#e0668a"; ctx.fillText(f.s, x, p.y);
    ctx.globalAlpha = 1;
  }
}
function drawPending(p){
  // ふってくる 場所の 影（だんだん こく、小さく まとまる）
  const q = trayP(p.u, 0, p.v);
  const k = p.t / p.warn;
  const rx = p.r*.95*q.s*(1.5 - .5*k);

  ctx.beginPath(); ctx.ellipse(q.x, q.y, rx, rx*SINP, 0, 0, 7); ctx.fill();

}

/* お盆が いっぱいに ちかづくと ふちが だんだん 赤く なる。あふれそうに なったら 点滅 */

function draw(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const items = [];
  for (const b of balls) items.push({ d: trayP(b.u, b.r*.5, b.v).d, draw: () => drawBall(b) });
  for (const g of runners) if (g.stage <= 2) items.push({ d: trayP(g.u, 0, g.v).d - 10, draw: () => drawRunnerGroup(g) });
  for (const o of OBS) items.push({ d: trayP(o.u, OB_H*.3, o.v).d, draw: () => drawObstacle(o) });

  rimItems(items);

  for (const b of balls) if (b.h > RIM_H + 6 && b.state !== "merge") drawBall(b);

  }
}
